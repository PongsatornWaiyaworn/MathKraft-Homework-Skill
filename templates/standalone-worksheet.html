<script>/* ===== MathKraft HW engine — UI ===== */
(function () {
  'use strict';
  const MK = window.MK;
  const HW = window.HW;
  const Q = MK.Q;

  /* ---------- tiny DOM helpers ---------- */
  function h(tag, props) {
    const el = document.createElement(tag);
    if (props) {
      for (const k in props) {
        const v = props[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = rich(v);
        else if (k === 'text') el.textContent = v;
        else if (k === 'style') el.style.cssText = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach((x) => add(el, x));
    else if (c instanceof Node) el.appendChild(c);
    else el.appendChild(document.createTextNode(String(c)));
  }
  function km(t, disp) {
    try {
      if (window.katex) return window.katex.renderToString(t, { displayMode: disp, throwOnError: false, strict: 'ignore' });
    } catch (e) { /* fall through */ }
    return t;
  }
  function rich(s) {
    return String(s == null ? '' : s)
      .replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => km(t, true))
      .replace(/\\\[([\s\S]+?)\\\]/g, (m, t) => km(t, true))
      .replace(/\\\(([\s\S]+?)\\\)/g, (m, t) => km(t, false))
      .replace(/(?<!\\)\$([^\$\n]+?)(?<!\\)\$/g, (m, t) => km(t, false))
      .replace(/\\\$/g, '$');
  }
  function R(html, tag, cls) { return h(tag || 'span', { class: cls || '', html }); }
  const $ = (s, r) => (r || document).querySelector(s);
  const mmss = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const sc = (x) => String(+(+x).toFixed(2)); // 1.5 -> "1.5", 2 -> "2"
  const safe = (fn, d) => { try { return fn(); } catch (e) { return d; } };
  function toast(msg) {
    const t = h('div', { class: 'toast', text: msg });
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  /* ---------- storage ---------- */
  const KEY = 'mk-template-' + HW.id;
  const SKEY = 'mk-template-student';
  function loadSaved() { return safe(() => JSON.parse(localStorage.getItem(KEY)) || null, null); }
  function save(o) { safe(() => localStorage.setItem(KEY, JSON.stringify(o))); }
  function loadStudent() { return safe(() => JSON.parse(localStorage.getItem(SKEY)) || null, null); }
  function saveStudent(s) { safe(() => localStorage.setItem(SKEY, JSON.stringify(s))); }

  /* ---------- state ---------- */
  const S = {
    student: null,
    saved: { attempts: [] }, // completed attempts
    run: null, // running attempt
    fs: 1,
  };
  const app = document.getElementById('app');
  let timerH = null;

  /* =====================================================================
     DRAG / TAP chips
     ===================================================================== */
  const dnd = { sel: null, scope: null };
  function clearSel() {
    if (dnd.sel) dnd.sel.el.classList.remove('sel');
    dnd.sel = null;
    document.querySelectorAll('.tap-ready').forEach((z) => z.classList.remove('tap-ready'));
  }
  function mkChip(html, key, scope) {
    const el = h('button', { type: 'button', class: 'chip' }, h('span', { class: 'cb', html }));
    const chip = { el, key, zone: null, locked: false, scope };
    el._chip = chip;
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (e.detail === 0) toggleSel(chip); // keyboard activation
    });
    el.addEventListener('pointerdown', (e) => {
      if (chip.locked || (e.button != null && e.button > 0)) return;
      const sx = e.clientX, sy = e.clientY;
      let dragging = false, ghost = null, over = null, gw = 0, lastX = sx, lastY = sy, scroller = null;
      try { el.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ }
      const zoneAt = (x, y) => {
        const els = document.elementsFromPoint(x, y);
        for (const n of els) { const z = n.closest && n.closest('.zone,.slot'); if (z && z._zone && z._zone.scope === chip.scope) return z._zone; }
        return null;
      };
      const hilite = () => {
        const z = zoneAt(lastX, lastY);
        if (over && over !== z) over.el.classList.remove('over');
        over = z; if (z) z.el.classList.add('over');
      };
      const move = (ev) => {
        lastX = ev.clientX; lastY = ev.clientY;
        if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
          dragging = true;
          clearSel();
          ghost = el.cloneNode(true);
          ghost.classList.add('ghost');
          gw = el.offsetWidth;
          ghost.style.width = gw + 'px';
          document.body.appendChild(ghost);
          el.classList.add('drag-src');
          // auto-scroll the page while dragging near the top/bottom edge (phones)
          scroller = setInterval(() => {
            const vh = window.innerHeight;
            if (lastY < 90) window.scrollBy(0, -16); else if (lastY > vh - 90) window.scrollBy(0, 16); else return;
            hilite();
          }, 16);
        }
        if (dragging) {
          ghost.style.transform = 'translate(' + (ev.clientX - gw / 2) + 'px,' + (ev.clientY - 26) + 'px)';
          hilite();
        }
      };
      const up = (ev) => {
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
        try { el.releasePointerCapture(e.pointerId); } catch (x) { /* ignore */ }
        if (scroller) clearInterval(scroller);
        if (dragging) {
          ghost.remove(); el.classList.remove('drag-src');
          if (over) over.el.classList.remove('over');
          const z = zoneAt(ev.clientX, ev.clientY);
          if (z) place(chip, z);
        } else toggleSel(chip);
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    });
    return chip;
  }
  function toggleSel(chip) {
    if (chip.locked) return;
    const same = dnd.sel === chip;
    clearSel();
    if (same) return;
    dnd.sel = chip; chip.el.classList.add('sel');
    chip.scope.zones.forEach((z) => z.el.classList.add('tap-ready'));
  }
  function mkZone(el, scope, o) {
    const zone = Object.assign({ el, scope, chips: [], cap: Infinity, key: null, pool: false }, o);
    el._zone = zone;
    scope.zones.push(zone);
    el.addEventListener('click', () => { if (dnd.sel && dnd.sel.scope === scope) { const c = dnd.sel; clearSel(); place(c, zone); } });
    return zone;
  }
  function detach(chip) {
    if (chip.zone) {
      chip.zone.chips = chip.zone.chips.filter((c) => c !== chip);
      if (chip.zone.onChange) chip.zone.onChange();
    }
    chip.zone = null;
  }
  function moveTo(chip, zone) {
    detach(chip);
    zone.el.appendChild(chip.el);
    zone.chips.push(chip); chip.zone = zone;
    if (zone.onChange) zone.onChange();
  }
  function place(chip, zone) {
    if (chip.locked) return;
    if (zone.cap === 1 && zone.chips.length >= 1 && zone.chips[0] !== chip) {
      const old = zone.chips[0];
      if (old.locked) return;
      moveTo(old, zone.scope.pool);
    }
    moveTo(chip, zone);
    chip.el.classList.remove('no');
    if (scopeChanged) scopeChanged(zone.scope);
  }
  let scopeChanged = null;

  /* =====================================================================
     QUESTION COMPONENTS
     each returns {el, weight, done, credit}; call c.finish(credit) when done
     ===================================================================== */
  function newComp(q) {
    return { q, weight: MK.weightOf(q), done: false, credit: 0, onDone: null };
  }
  function finishComp(c, credit) {
    c.done = true; c.credit = credit;
    if (c.onDone) c.onDone();
  }
  function fbSet(box, kind, text) {
    box.className = 'fb ' + (kind || '');
    box.innerHTML = '';
    if (!text) return;
    const ic = { ok: '✓', no: '✗', hint: '💡' }[kind] || '';
    box.append(h('span', { class: 'ic', text: ic }), R(text, 'div'));
  }
  function whyBox(why, open) {
    if (!why) return null;
    return h('details', { class: 'why', open: open ? true : null }, h('summary', { text: 'ดูวิธีคิด' }), h('div', { class: 'wb', html: why }));
  }

  /* ----- generic checker with 2 tries (1.0 first try, 0.5 second try) ----- */
  function makeChecker(c, ctx, parts, o) {
    let tries = 0;
    const fb = o.fb;
    function finalize(allRight) {
      const wsum = parts.reduce((s, p) => s + (p.weight || 1), 0);
      const cr = parts.reduce((s, p) => s + (p.weight || 1) * p.credit, 0) / wsum;
      ctx.stats.items += parts.length;
      ctx.stats.first += parts.filter((p) => p.credit === 1).length;
      o.btn.disabled = true;
      if (allRight) fbSet(fb, 'ok', tries === 1 ? 'ถูกต้องทั้งหมด! เยี่ยมมาก' : 'ถูกต้องแล้ว (แก้ได้ในครั้งที่ 2 ได้คะแนนครึ่งหนึ่งในข้อที่แก้)');
      else fbSet(fb, 'no', 'ครบ 2 ครั้งแล้ว — ดูเฉลยและวิธีคิดด้านล่าง ข้อที่ยังไม่ถูกจะไม่ได้คะแนน');
      if (o.after) o.after();
      finishComp(c, cr);
    }
    function check() {
      if (c.done) return;
      const open = parts.filter((p) => !p.done);
      if (open.some((p) => !p.filled())) { fbSet(fb, 'hint', o.fillMsg || 'ตอบให้ครบทุกช่องก่อนกดตรวจ'); return; }
      tries++; ctx.stats.tries++;
      let wrong = 0;
      open.forEach((p) => {
        if (p.test()) { p.done = true; p.credit = tries === 1 ? 1 : 0.5; if (p.onRight) p.onRight(tries); }
        else { wrong++; if (p.onWrong) p.onWrong(tries); }
      });
      if (!wrong) return finalize(true);
      if (tries >= 2) {
        parts.filter((p) => !p.done).forEach((p) => { p.done = true; p.credit = 0; if (p.reveal) p.reveal(); });
        return finalize(false);
      }
      ctx.stats.hints++;
      fbSet(fb, 'hint', (o.hint ? o.hint + ' — ' : '') + 'ยังไม่ถูกบางส่วน ลองแก้อีกครั้ง (ตอบถูกในครั้งที่ 2 ได้ครึ่งคะแนนของข้อนั้น)');
    }
    o.btn.addEventListener('click', check);
    return check;
  }

  /* ----- choice (F1) ----- */
  function mChoice(q, ctx) {
    const c = newComp(q);
    const idx = q.options.map((_, i) => i);
    const order = q.shuffle === false ? idx : ctx.R.shuffle(idx);
    c.order = order;
    const box = h('div', { class: 'qbody' });
    const fb = h('div', { class: 'fb' });
    const opts = h('div', { class: 'opts' });
    const btns = order.map((oi, pos) => {
      const b = h('button', { type: 'button', class: 'opt', 'data-oi': oi }, h('span', { class: 'k', text: 'กขคงจฉ'[pos] || pos + 1 }), R(q.options[oi], 'span'));
      b.addEventListener('click', () => {
        if (c.done) return;
        const ok = oi === q.answer;
        btns.forEach((x) => (x.disabled = true));
        b.classList.add(ok ? 'ok' : 'no');
        if (!ok) btns[order.indexOf(q.answer)].classList.add('ok');
        ctx.stats.items++; ctx.stats.tries++;
        if (ok) { ctx.stats.first++; fbSet(fb, 'ok', q.okMsg || 'ถูกต้อง!'); }
        else fbSet(fb, 'no', 'ยังไม่ถูก — คำตอบที่ถูกคือข้อที่ไฮไลต์สีเขียว');
        const w = whyBox(q.why, !ok); if (w) box.appendChild(w);
        finishComp(c, ok ? 1 : 0);
      });
      return b;
    });
    box.append(R(q.q, 'div', 'qbody'), opts, fb);
    btns.forEach((x) => opts.appendChild(x));
    c.el = box;
    return c;
  }

  /* ----- fill (F2) ----- */
  function ansText(f) {
    if (f.show) return f.show;
    if (f.set) return f.set.map((x) => MK.fmt(x)).join(' , ');
    if (f.text) return [].concat(f.text)[0];
    const a = [].concat(f.answer)[0];
    return typeof a === 'number' ? MK.fmt(a) : String(a);
  }
  function mFill(q, ctx) {
    const c = newComp(q);
    const fields = q.fields || [{ answer: q.answer, set: q.set, text: q.text, tol: q.tol, unit: q.unit, kb: q.kb, ph: q.ph, show: q.show }];
    const box = h('div', { class: 'qbody' });
    const fb = h('div', { class: 'fb' });
    const btn = h('button', { type: 'button', class: 'btn navy sm', text: 'ตรวจคำตอบ' });
    c.inputs = [];
    const parts = fields.map((f) => {
      const a0 = [].concat(f.answer)[0];
      const intNonNeg = !f.set && !f.text && typeof a0 === 'number' && a0 >= 0 && Math.floor(a0) === a0;
      const input = h('input', { class: 'num-in', type: 'text', inputmode: f.kb === 'full' ? 'text' : intNonNeg ? 'numeric' : 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', enterkeyhint: 'done', placeholder: f.ph || 'พิมพ์คำตอบ', 'aria-label': f.label || 'คำตอบ' });
      const rev = h('span', { class: 'rev hide' });
      const row = h('div', { class: 'fillrow' }, f.label ? R(f.label, 'span', 'flab') : null, input, f.unit ? R(f.unit, 'span', 'unit') : null, rev);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); btn.click(); } });
      c.inputs.push(input);
      box.appendChild(row);
      return {
        weight: f.weight || 1,
        filled: () => input.value.trim() !== '',
        test: () => MK.matchAnswer(input.value, f),
        onRight: () => { input.classList.remove('no'); input.classList.add('ok'); input.readOnly = true; },
        onWrong: () => { input.classList.add('no'); },
        reveal: () => { input.classList.remove('no'); input.readOnly = true; rev.innerHTML = 'เฉลย: ' + rich(ansText(f)); rev.classList.remove('hide'); },
      };
    });
    box.insertBefore(R(q.q, 'div', 'qbody'), box.firstChild);
    box.append(h('div', { class: 'row' }, btn), fb);
    makeChecker(c, ctx, parts, { fb, btn, hint: q.hint, after: () => { const w = whyBox(q.why, !parts.every((p) => p.credit === 1)); if (w) box.appendChild(w); } });
    c.el = box;
    return c;
  }

  /* ----- sort / pairs (F3) ----- */
  function mMatch(q, ctx) {
    const c = newComp(q);
    const scope = { zones: [], pool: null };
    const box = h('div', { class: 'qbody' });
    const fb = h('div', { class: 'fb' });
    const btn = h('button', { type: 'button', class: 'btn navy sm', text: 'ตรวจคำตอบ', disabled: true });
    const poolEl = h('div', { class: 'zone pool' });
    const pool = mkZone(poolEl, scope, { pool: true });
    scope.pool = pool;
    let parts = [];
    const shuffled = ctx.R.shuffle(q.type === 'sort' ? q.items.map((it) => ({ html: it.html, key: it.bin })) : q.chips);
    const chips = shuffled.map((it) => mkChip(it.html, it.key, scope));
    c.chips = chips;
    const refresh = () => {
      if (c.done) return;
      const open = parts.filter((p) => !p.done);
      btn.disabled = !open.every((p) => p.filled());
    };
    scopeChanged = (sc2) => { if (sc2 === scope) refresh(); };
    pool.onChange = refresh;

    if (q.type === 'sort') {
      const bins = h('div', { class: 'bins' });
      const zones = q.bins.map((b) => {
        const el = h('div', { class: 'zone' }, h('div', { class: 'zt', html: b.label }));
        bins.appendChild(el);
        return mkZone(el, scope, { key: b.id });
      });
      c.zones = zones;
      box.append(R(q.q, 'div', 'qbody'), h('div', { class: 'mute', style: 'font-size:.86em', text: 'ลากการ์ดไปวางในกลุ่มที่ถูก หรือแตะการ์ดแล้วแตะกลุ่ม' }), poolEl, bins);
      chips.forEach((ch) => moveTo(ch, pool));
      parts = chips.map((ch) => ({
        weight: 1,
        filled: () => ch.zone && !ch.zone.pool,
        test: () => ch.zone && ch.zone.key === ch.key,
        onRight: () => { ch.locked = true; ch.el.classList.add('locked', 'ok'); },
        onWrong: () => { ch.el.classList.add('no'); moveTo(ch, pool); },
        reveal: () => { const z = zones.find((zz) => zz.key === ch.key); moveTo(ch, z); ch.locked = true; ch.el.classList.add('locked', 'rev'); ch.el.classList.remove('no'); },
      }));
    } else {
      const rows = h('div');
      const slots = q.left.map((l) => {
        const slotEl = h('div', { class: 'slot' }, h('span', { class: 'ph', text: 'วางที่นี่' }));
        rows.appendChild(h('div', { class: 'pair-row' }, R(l.html, 'div'), slotEl));
        return mkZone(slotEl, scope, { key: l.key, cap: 1 });
      });
      slots.forEach((s) => { const ph = s.el.querySelector('.ph'); s.onChange = () => { ph.classList.toggle('hide', s.chips.length > 0); refresh(); }; });
      c.zones = slots;
      box.append(R(q.q, 'div', 'qbody'), h('div', { class: 'mute', style: 'font-size:.86em', text: 'ลากการ์ดไปวางในช่อง หรือแตะการ์ดแล้วแตะช่อง' }), rows, poolEl);
      chips.forEach((ch) => moveTo(ch, pool));
      parts = slots.map((s) => ({
        weight: 1,
        filled: () => s.chips.length === 1,
        test: () => s.chips.length === 1 && s.chips[0].key === s.key,
        onRight: () => { const ch = s.chips[0]; ch.locked = true; ch.el.classList.add('locked', 'ok'); },
        onWrong: () => { const ch = s.chips[0]; ch.el.classList.add('no'); moveTo(ch, pool); },
        reveal: () => {
          const ch = chips.find((x) => x.key === s.key && !x.locked);
          if (ch) { moveTo(ch, s); ch.locked = true; ch.el.classList.add('locked', 'rev'); ch.el.classList.remove('no'); }
        },
      }));
    }
    box.append(h('div', { class: 'row' }, btn), fb);
    makeChecker(c, ctx, parts, { fb, btn, hint: q.hint, fillMsg: 'วางให้ครบทุกการ์ดก่อนกดตรวจ', after: () => { clearSel(); if (!pool.chips.length) poolEl.classList.add('hide'); const w = whyBox(q.why, !parts.every((p) => p.credit === 1)); if (w) box.appendChild(w); } });
    c.el = box;
    return c;
  }

  /* ----- order (F4) : arrange solution steps + choose a reason for each ----- */
  function mOrder(q, ctx) {
    const c = newComp(q);
    const n = q.steps.length;
    let ids = ctx.R.shuffle(q.steps.map((_, i) => i));
    if (ids.every((v, i) => v === i)) ids = ids.slice(1).concat(ids[0]);
    const sel = {};
    const box = h('div', { class: 'qbody' });
    const fb = h('div', { class: 'fb' });
    const btn = h('button', { type: 'button', class: 'btn navy sm', text: 'ตรวจวิธีทำ' });
    const list = h('div', { class: 'ord' });
    const rowEl = {};
    const selEl = {}, setters = {}, wraps = {};
    q.steps.forEach((s, i) => {
      const sl = h('select', { 'aria-label': 'เลือกเหตุผลของขั้นตอน' }, h('option', { value: '', text: '— เลือกเหตุผลของขั้นตอนนี้ —' }), q.reasons.map((r, ri) => h('option', { value: ri, html: r.replace(/\\\(|\\\)/g, '').replace(/(?<!\\)\$/g, '') })));
      // option text cannot render KaTeX; strip delimiters for readability
      const cap = h('div', { class: 'mute', style: 'font-size:.82em;margin-top:3px' });
      const setSel = (v) => { sel[i] = v; sl.value = v == null ? '' : v; cap.innerHTML = v == null ? '' : rich(q.reasons[v]); };
      sl.addEventListener('change', () => { sel[i] = sl.value === '' ? null : +sl.value; cap.innerHTML = sel[i] == null ? '' : rich(q.reasons[sel[i]]); });
      selEl[i] = sl; sel[i] = null; setters[i] = setSel; wraps[i] = h('div', {}, sl, cap);
    });
    function paint() {
