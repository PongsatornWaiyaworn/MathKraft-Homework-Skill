<!-- 3. MathKraft Retro-Neobrutalism Design System -->
<style>
:root{
  --cream:#F4F1E8; --paper:#FFFDF7; --ink:#111A4C; --navy:#16205B; --navy2:#2B3A9B;
  --red:#F4522D; --gold:#F5B335; --teal:#14A38B; --violet:#7B6CF0; --sky:#3C9DFF; --pink:#FF7AA2;
  --red-s:#FFD9CF; --gold-s:#FFEBC2; --teal-s:#CDEFE7; --violet-s:#E1DEFF; --sky-s:#D3E8FF; --pink-s:#FFDDE8;
  --accent:var(--red); --accent-s:var(--red-s);
  --line:rgba(22,32,91,.16); --mute:#5B6490; --r:18px; --fs:1;
}
body.u2{--accent:var(--teal);--accent-s:var(--teal-s)}
body.u3{--accent:var(--violet);--accent-s:var(--violet-s)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:'Prompt','Leelawadee UI','Noto Sans Thai','Sarabun','Tahoma',sans-serif;
  font-size:calc(16.5px * var(--fs));line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
.wrap{width:min(920px,94vw);margin:0 auto}
.hide{display:none!important}
.mute{color:var(--mute)}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
noscript .nojs{padding:24px;text-align:center;font-weight:700;color:#8F2410}

/* ---------- top bar ---------- */
.top{display:none !important;visibility:hidden !important;height:0 !important;overflow:hidden !important}
.top .wrap{display:flex;align-items:center;gap:10px;padding:8px 0}
.top .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9em;color:var(--navy);min-width:0}
.top .brand img{height:30px;width:auto}
.top .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.tbtn{border:2px solid var(--navy);background:var(--paper);border-radius:11px;min-width:38px;height:36px;padding:0 10px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--navy);font-size:.88em}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--navy);color:#fff;border-radius:10px;padding:3px 10px;font-size:.88em;white-space:nowrap}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:2px solid var(--navy);background:var(--cream)}
.hero .wrap{position:relative;padding:22px 0 20px}
.hero-art{position:absolute;right:-60px;top:-50px;width:380px;height:260px;pointer-events:none;opacity:.9}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:.82em;font-weight:500;color:var(--mute)}
.eyebrow img{height:34px;width:auto}
.eyebrow .dash{width:26px;height:3px;background:var(--accent);border-radius:2px}
.hero h1{font-family:'MKDisplay','Prompt',serif;font-weight:800;font-size:calc(38px * var(--fs));color:var(--navy);margin:10px 0 6px;letter-spacing:-.4px;max-width:720px;position:relative}
.hero h1 .num{color:var(--accent);margin-right:12px;font-family:'Prompt',sans-serif;font-weight:700}
.hero .sub{margin:0;max-width:640px;color:#2F3A78;position:relative}
.metas{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative}
.meta{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--navy);background:var(--paper);border-radius:999px;padding:2px 12px;font-size:.84em;font-weight:600}
.meta b{color:var(--accent)}

/* ---------- cards & buttons ---------- */
main{padding:22px 0 40px}
.card{background:var(--paper);border:2px solid var(--navy);border-radius:var(--r);box-shadow:5px 5px 0 var(--navy);padding:18px 20px;margin-bottom:22px;position:relative}
.card.tint{background:var(--accent-s)}
.card.flat{box-shadow:none}
.card h2{font-size:1.25em;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h3{font-size:1.02em;margin:12px 0 6px}
.tag{white-space:nowrap;font-size:.62em;font-weight:700;background:var(--accent);color:#fff;border-radius:8px;padding:2px 10px;letter-spacing:.3px}
.tag.k{background:var(--navy2)}
.tag.p{background:var(--teal)}
.btn{border:2px solid var(--navy);background:var(--paper);border-radius:12px;padding:8px 18px;font-weight:600;cursor:pointer;box-shadow:0 4px 0 var(--navy);transition:transform .08s;font-size:.95em;min-height:44px}
.btn:hover{background:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.btn.pri{background:var(--accent);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.sm{padding:3px 12px;font-size:.85em;min-height:34px;box-shadow:0 3px 0 var(--navy)}
.btn[disabled]{opacity:.4;pointer-events:none}
a.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
a.btn.navy{color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* ---------- intro form ---------- */
.formgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
@media(max-width:620px){.formgrid{grid-template-columns:1fr 1fr}.formgrid .f-name{grid-column:1/-1}.hero h1{font-size:calc(28px * var(--fs))}.hero-art{opacity:.3}.card{padding:15px 14px}}
.field label{display:block;font-weight:600;font-size:.88em;margin-bottom:4px}
.field input,.field select{width:100%;border:2px solid var(--navy);border-radius:12px;padding:9px 12px;background:#fff;font-weight:600;min-height:44px}
.field input:focus,.num-in:focus{outline:3px solid var(--gold)}
.err{color:#8F2410;font-weight:600;font-size:.9em;margin-top:8px;min-height:1.3em}
.rules{margin:0;padding-left:1.3em;font-size:.93em;color:#2B3570}
.rules li{margin:3px 0}
.lv-list{display:grid;gap:8px;margin-top:6px}
.lv-item{display:flex;gap:10px;align-items:flex-start;font-size:.93em}
.lv-item .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85em;margin-top:2px}
.saved{border:2px dashed var(--navy);background:var(--gold-s);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:.92em}

/* ---------- progress pills ---------- */
.pills{background:rgba(244,241,232,.95);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.pills .wrap{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.pills .wrap::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:2px solid var(--navy);background:var(--paper);border-radius:999px;padding:3px 14px 3px 4px;font-weight:600;font-size:.84em;white-space:nowrap}
.pill .n{width:26px;height:26px;border-radius:50%;background:var(--cream);border:2px solid var(--navy);display:grid;place-items:center;font-size:.85em;font-weight:700}
.pill.on{background:var(--navy);color:#fff}
.pill.on .n{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.done .n{background:var(--teal);border-color:var(--teal);color:#fff}
.pill.lock{opacity:.5}

/* ---------- level & question cards ---------- */
.lv-head{margin-bottom:16px}
.lv-head h2{font-size:1.45em;font-family:'MKDisplay','Prompt',serif;font-weight:800;color:var(--navy);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lv-head p{margin:6px 0 0;color:#2B3570}
.ask{display:flex;gap:12px;align-items:flex-start;background:var(--gold-s);border:2px dashed var(--navy);border-radius:16px;padding:10px 14px;margin:0 0 18px;font-size:.93em}
.ask b{background:var(--navy);color:#fff;border-radius:8px;padding:0 9px;font-size:.82em;white-space:nowrap;margin-top:2px}
.qcard{background:var(--paper);border:2px solid var(--navy);border-radius:var(--r);box-shadow:4px 4px 0 var(--navy);padding:16px 18px;margin-bottom:20px;position:relative}
.qcard.done{border-color:var(--teal);box-shadow:4px 4px 0 var(--teal)}
.qcard .qh{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.qno{background:var(--navy);color:#fff;border-radius:9px;padding:0 10px;font-weight:700;font-size:.85em}
.qtype{font-size:.76em;font-weight:700;color:var(--accent);letter-spacing:.3px}
.qstat{margin-left:auto;font-size:.8em;font-weight:700;color:var(--mute)}
.qcard.done .qstat{color:var(--teal)}
.qbody{font-size:1em}
.qbody p{margin:.3em 0 .6em}
.story{background:var(--sky-s);border-left:5px solid var(--sky);border-radius:0 12px 12px 0;padding:8px 14px;margin:0 0 12px;font-size:.95em}
.subq{border-top:2px dashed var(--line);margin-top:14px;padding-top:12px}
.subq:first-of-type{border-top:0;margin-top:0;padding-top:0}
.subq .sl{font-size:.8em;font-weight:700;color:var(--accent);margin-bottom:2px}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2.5px solid var(--navy);background:#fff;border-radius:14px;padding:9px 14px;cursor:pointer;font-weight:500;min-height:46px;box-shadow:0 3px 0 var(--navy);width:100%}
.opt:hover{background:var(--gold-s)}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--navy);display:grid;place-items:center;font-weight:700;font-size:.8em;background:var(--cream)}
.opt.ok{background:var(--teal-s);border-color:var(--teal);box-shadow:0 3px 0 var(--teal)}
.opt.ok .k{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.no{background:var(--red-s);border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.opt.no .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt[disabled]{cursor:default}
.fillrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.fillrow .flab{font-weight:600}
.num-in{min-width:7em;width:11em;max-width:100%;border:2.5px solid var(--navy);border-radius:12px;padding:8px 12px;background:#fff;font-weight:600;font-size:1.05em;min-height:46px}
.num-in.ok{background:var(--teal-s);border-color:var(--teal)}
.num-in.no{background:var(--red-s);border-color:var(--red)}
.num-in[readonly]{opacity:.9}
.unit{font-weight:600;color:var(--mute)}
.rev{font-weight:700;color:#06604F;background:var(--teal-s);border-radius:8px;padding:0 10px}
.fb{border-radius:12px;padding:8px 14px;font-weight:600;display:flex;align-items:flex-start;gap:10px;background:rgba(22,32,91,.06);margin-top:10px}
.fb:empty{display:none}
.fb.ok{background:var(--teal-s);color:#06604F}
.fb.no{background:var(--red-s);color:#8F2410}
.fb.hint{background:var(--gold-s);color:#6A4A00}
.fb .ic{font-size:1.15em;line-height:1.5}
details.why{margin-top:10px;background:#fff;border:2px solid var(--navy);border-radius:14px;padding:8px 14px}
details.why summary{cursor:pointer;font-weight:700;font-size:.92em;color:var(--navy)}
details.why .wb{margin-top:6px;font-size:.95em}
details.why .wb p{margin:.3em 0}

/* ---------- chips & zones (drag / tap) ---------- */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 14px;border:2.5px solid var(--navy);border-radius:14px;background:#fff;font-weight:500;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 4px 0 var(--navy);text-align:left;line-height:1.4;max-width:100%}
.chip:active{cursor:grabbing}
.chip .cb{display:block;min-width:0}
.chip .cb b{font-weight:700}
.chip.sel{outline:4px solid var(--gold);outline-offset:2px}
.chip.drag-src{opacity:.28}
.chip.locked{cursor:default;touch-action:auto}
.chip.ok{background:var(--teal-s);border-color:var(--teal);box-shadow:0 4px 0 var(--teal)}
.chip.no{background:var(--red-s);border-color:var(--red);box-shadow:0 4px 0 var(--red);animation:shake .35s}
.chip.rev{background:var(--gold-s);border-color:var(--navy);color:inherit;padding:6px 14px;border-radius:14px;font-weight:500}
.ghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;opacity:.96;filter:drop-shadow(0 10px 8px rgba(17,26,76,.3));max-width:80vw}
.zone{border:2.5px dashed rgba(22,32,91,.45);border-radius:16px;min-height:70px;padding:8px;background:rgba(255,255,255,.55);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;transition:background .15s}
.zone.over,.zone.tap-ready{background:var(--gold-s);border-color:var(--navy);border-style:solid}
.zone .zt{width:100%;font-size:.84em;font-weight:700;color:var(--navy)}
.pool{background:rgba(22,32,91,.05);border-style:solid;border-color:var(--line);margin:10px 0}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:10px 0}
.pair-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,.8fr);gap:10px;align-items:center;margin:8px 0}
@media(max-width:520px){.pair-row{grid-template-columns:1fr}}
.slot{min-height:54px;border:2.5px dashed var(--navy);border-radius:14px;display:flex;align-items:center;justify-content:center;background:#fff;padding:4px}
.slot.over,.slot.tap-ready{background:var(--gold-s);border-style:solid}
.slot .ph{font-size:.82em;color:var(--mute)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease}

/* ---------- tree builder ---------- */
.tree{display:flex;align-items:center;gap:0;overflow-x:auto;padding:10px 4px 14px}
.t-node{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:4px 12px;border:2.5px solid var(--navy);border-radius:12px;background:#fff;font-weight:600;font-size:.92em;white-space:nowrap}
.t-root{background:var(--navy);color:#fff}
.t-branches,.t-leaves{display:flex;flex-direction:column;gap:10px;margin-left:30px;position:relative}
.t-leaves{margin-left:30px}
.t-group,.t-leafwrap{position:relative;display:flex;align-items:center;padding-left:0}
.t-group::before,.t-leafwrap::before{content:'';position:absolute;left:-30px;width:30px;top:50%;border-top:2.5px solid var(--navy)}
.t-branches>.t-group::after,.t-leaves>.t-leafwrap::after{content:'';position:absolute;left:-30px;top:-5px;bottom:-5px;border-left:2.5px solid var(--navy)}
.t-branches>.t-group:first-child::after,.t-leaves>.t-leafwrap:first-child::after{top:50%}
.t-branches>.t-group:last-child::after,.t-leaves>.t-leafwrap:last-child::after{bottom:50%}
.t-branches>.t-group:only-child::after,.t-leaves>.t-leafwrap:only-child::after{display:none}
button.t-node{cursor:pointer;font-family:inherit}
.t-node.ghost-n{border-style:dashed;opacity:.55;background:transparent}
.t-node.ghost-n.live{opacity:1;background:#fff;animation:pulse 1.4s infinite}
.t-node.ghost-n.dead{opacity:.22;pointer-events:none}
.t-node.built{border-style:solid;opacity:1;background:var(--gold-s)}
.t-node.leaf.built{background:var(--teal-s);border-color:var(--teal)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,179,53,.0)}50%{box-shadow:0 0 0 5px rgba(245,179,53,.55)}}
.t-leafwrap.off::before,.t-leaves.off>.t-leafwrap::after{opacity:.2}
.t-group.off::before{opacity:.2}
.t-branches>.t-group.off::after{opacity:.2}
.counter{display:inline-flex;align-items:baseline;gap:6px;font-weight:700;background:var(--navy);color:#fff;border-radius:14px;padding:3px 14px;font-size:.92em}
.counter b{font-size:1.5em;color:var(--gold);line-height:1}
.rulebox{background:var(--gold-s);border:2px dashed var(--navy);border-radius:12px;padding:6px 12px;font-size:.92em;font-weight:600;margin:6px 0 10px}

/* ---------- order / find ---------- */
.ord{display:grid;gap:8px;margin:8px 0}
.ord-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;border:2.5px solid var(--navy);border-radius:14px;padding:8px 10px;background:#fff}
.ord-row.ok{border-color:var(--teal);background:var(--teal-s)}
.ord-row.no{border-color:var(--red);background:var(--red-s)}
.ord-ctl{display:flex;flex-direction:column;gap:4px}
.ord-ctl button{border:2px solid var(--navy);background:var(--paper);border-radius:8px;width:36px;height:30px;font-weight:700;cursor:pointer;line-height:1}
.ord-ctl button:active{background:var(--gold-s)}
.ord-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.ord-main select,.cause select{width:100%;border:2px solid var(--navy);border-radius:10px;padding:6px 8px;background:var(--paper);min-height:40px;font-size:.92em}
.ord-n{font-weight:700;color:var(--accent);margin-right:6px}
.ln{display:flex;gap:10px;align-items:flex-start;border:2.5px solid var(--navy);border-radius:12px;background:#fff;padding:8px 12px;width:100%;text-align:left;cursor:pointer;margin:6px 0;font-weight:500}
.ln .no-{flex:0 0 auto;font-weight:700;color:var(--accent)}
.ln.sel{background:var(--gold-s);outline:3px solid var(--gold)}
.ln.ok{background:var(--teal-s);border-color:var(--teal)}
.ln.no{background:var(--red-s);border-color:var(--red)}
.ln[disabled]{cursor:default}

/* ---------- lab / graph ---------- */
.lab{background:#fff;border:2px solid var(--navy);border-radius:16px;padding:12px 14px;margin:10px 0}
.sl-row{display:flex;align-items:center;gap:12px;font-weight:600;flex-wrap:wrap;margin:6px 0}
.sl-row output{min-width:3em;text-align:center;background:var(--navy);color:#fff;border-radius:8px;padding:0 8px;font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:140px;height:10px;background:var(--cream);border:2px solid var(--navy);border-radius:999px;outline:none;touch-action:pan-y}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid var(--navy);cursor:grab}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--navy);cursor:grab}
.plot{width:100%;height:auto;background:#fff;border:2px solid var(--navy);border-radius:14px;touch-action:none;display:block}
.plot text{font-family:'Prompt','Leelawadee UI',Tahoma,sans-serif;font-size:11px;fill:var(--navy)}
table.t{border-collapse:separate;border-spacing:0;border:2px solid var(--navy);border-radius:12px;overflow:hidden;background:#fff;font-size:.93em;margin:8px 0}
table.t th,table.t td{padding:5px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center}
table.t th{background:var(--navy);color:#fff;font-weight:600}
table.t tr:last-child td{border-bottom:0}table.t td:last-child,table.t th:last-child{border-right:0}
.vault{display:flex;align-items:center;gap:12px;border:2.5px solid var(--navy);border-radius:16px;padding:10px 14px;background:var(--gold-s);margin:12px 0;font-weight:600}
.vault .lk{font-size:1.8em}
.vault.open{background:var(--teal-s)}
.vault code{font-family:inherit;font-weight:800;letter-spacing:2px;background:var(--navy);color:var(--gold);padding:1px 10px;border-radius:8px}

/* ---------- navigation ---------- */
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 10px;align-items:center}
.nav .hint{font-size:.88em;color:var(--mute);font-weight:600}

/* ---------- summary ---------- */
.sum-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
@media(max-width:560px){.sum-head{grid-template-columns:1fr}}
.stu{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:1.02em}
.stu b{color:var(--mute);font-weight:600}
.stu .v{font-weight:700}
.ring{width:128px;height:128px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tx{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .tx b{font-size:1.9em;font-family:'MKDisplay','Prompt',serif;color:var(--navy)}
.ring .tx span{font-size:.75em;color:var(--mute);font-weight:600}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.kp .c{border:2px solid var(--navy);border-radius:14px;padding:8px 10px;text-align:center;background:#fff}
.kp .c small{display:block;color:var(--mute);font-weight:600}
.kp .c b{font-size:1.5em;font-family:'MKDisplay','Prompt',serif;color:var(--navy)}
.kp .c b i{font-style:normal;font-size:.6em;color:var(--mute);font-family:'Prompt',sans-serif;font-weight:500}
.lvtab{width:100%;border-collapse:collapse;font-size:.93em}
.lvtab th,.lvtab td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.lvtab th{font-size:.8em;color:var(--mute);font-weight:600}
.lvtab td.num{text-align:right;white-space:nowrap;font-weight:700}
.barx{height:12px;border:2px solid var(--navy);border-radius:999px;background:#fff;overflow:hidden;min-width:70px}
.barx i{display:block;height:100%;background:var(--accent)}
.grade{display:inline-block;font-weight:800;border-radius:999px;padding:2px 14px;border:2px solid var(--navy);background:var(--gold-s)}
.grade.g4{background:var(--teal-s)}.grade.g3{background:var(--sky-s)}.grade.g2{background:var(--gold-s)}.grade.g1{background:var(--red-s)}
.evl ul{margin:6px 0 10px;padding-left:1.2em}
.evl li{margin:3px 0}
.code{display:inline-block;font-weight:800;letter-spacing:2px;font-size:1.05em;border:2px dashed var(--navy);border-radius:10px;padding:2px 12px;background:#fff}
.attempts{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.att{border:2px solid var(--navy);border-radius:12px;padding:4px 12px;background:#fff;font-size:.9em;font-weight:600}
.att.best{background:var(--teal-s);border-color:var(--teal)}
.shot{font-size:.9em;font-weight:600;background:var(--sky-s);border:2px dashed var(--navy);border-radius:12px;padding:8px 14px;margin-top:12px}
.footer{border-top:2px solid var(--navy);padding:14px 0 26px;font-size:.8em;color:var(--mute);text-align:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:8px 18px;font-weight:600;z-index:9998;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.katex{font-size:1.07em}
.katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden}
@media (max-width:480px){.pill{padding:3px 10px 3px 3px;gap:5px;font-size:.8em}.pill .n{width:24px;height:24px}.pills .wrap{gap:6px}}
@media print{.top,.pills,.nav,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}

/* ---------- sample-space lab ---------- */
.ss-wrap{overflow-x:auto;padding:4px 2px 8px;margin:0 -2px}
.ss-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:6px;max-width:560px}
.ss-grid.ss-2d{gap:4px;max-width:440px}
.ss-cell{border:2.5px solid var(--navy);background:#fff;border-radius:11px;min-height:44px;padding:2px 4px;font-weight:600;cursor:pointer;font-size:.9em;box-shadow:0 3px 0 var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.ss-cell.wide{min-height:46px;font-size:1em;letter-spacing:.06em}
.ss-cell:hover{background:var(--gold-s)}
.ss-cell.on{background:var(--gold);}
.ss-cell.off{border:2px dashed var(--line);background:transparent;box-shadow:none;cursor:default;color:var(--line);display:grid;place-items:center;min-height:44px}
.ss-cell.good{background:var(--teal-s);border-color:var(--teal);box-shadow:0 3px 0 var(--teal)}
.ss-cell.bad{background:var(--red-s);border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.ss-cell.miss{border-style:dashed;border-color:var(--teal);background:#fff}
.ss-cell[disabled]{cursor:default}
.ss-h{display:grid;place-items:center;font-size:.78em;font-weight:700;color:var(--mute);text-align:center;line-height:1.2;min-height:30px}
.ss-h.corner{font-size:.7em}
@media(max-width:420px){.ss-cell{font-size:.8em;padding:2px 1px}.ss-grid.ss-2d{gap:3px}}

.counter.ss-cnt{flex-wrap:wrap;gap:2px 8px;font-size:.85em;align-items:center;border-radius:12px}
.ss-cnt b{font-size:1.1em}

/* ---------- venn ---------- */
.venn-wrap{max-width:420px;margin:6px 0}
.venn{width:100%;height:auto;display:block}
.venn .vr{fill:#fff;stroke:none;cursor:pointer;transition:fill .1s}
.venn .vr:hover{fill:var(--gold-s)}
.venn .vr.on{fill:var(--gold)}
.venn .vr.good{fill:var(--teal-s)}
.venn .vr.bad{fill:var(--red-s)}
.venn .vo{stroke:var(--navy);stroke-width:2.5;pointer-events:none}
.venn .vr:focus{outline:none}
.venn .vr:focus-visible{stroke:var(--navy);stroke-width:3;stroke-dasharray:6 4}
.venn text{font-family:'Prompt',sans-serif;fill:var(--navy);pointer-events:none}
.venn .vl{font-size:20px;font-weight:700}
.venn .vl.s{font-size:15px;fill:var(--mute)}
.venn .vt{font-size:19px;font-weight:700}
.vlog{margin-top:8px;font-size:.9em}
.vl{padding:2px 0;color:var(--mute)}
.vl.ok{color:#06604F}.vl.half{color:#6A4A00}.vl.no{color:#8F2410}

/* ---------- simulation lab ---------- */
.simtab td,.simtab th{padding:5px 8px}
.simbar{position:relative;height:12px;background:var(--line);border-radius:6px;min-width:120px}
.simbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px;opacity:.85}
.simbar b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--navy);border-radius:2px;transform:translateX(-1px)}
.simsub{margin-top:10px}

/* ---------- coordinate graphs ---------- */
.gx-wrap{max-width:420px;margin:6px 0;background:#fff;border:2px solid var(--navy);border-radius:12px;padding:4px;overflow:hidden}
.gx-wrap.plot{cursor:crosshair}
.gx{width:100%;height:auto;display:block}
.gx text{font-family:'Prompt',sans-serif;fill:var(--navy);pointer-events:none}
.gx .gx-g{stroke:rgba(22,32,91,.14);stroke-width:1}
.gx .gx-m{stroke:rgba(22,32,91,.06);stroke-width:1}
.gx .gx-a{stroke:var(--navy);stroke-width:2}
.gx .gx-as{stroke:var(--mute);stroke-width:1.6;stroke-dasharray:6 5}
.gx .gx-t{font-size:11px;font-weight:600}
.gx .gx-t.b{font-size:12px;font-weight:700}
.gx .gx-c{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.gx .gx-c.c0{stroke:var(--accent)}
.gx .gx-c.c1{stroke:var(--sky)}
.gx .gx-c.c2{stroke:var(--teal)}
.gx .gx-c.c3{stroke:#C25B00}
.gx .gx-c.c4{stroke:var(--navy2)}
.gx .gx-l{font-size:13px;font-weight:700;stroke:none}
.gx .gx-l.c0{fill:var(--accent)}.gx .gx-l.c1{fill:var(--sky)}.gx .gx-l.c2{fill:var(--teal)}.gx .gx-l.c3{fill:#C25B00}.gx .gx-l.c4{fill:var(--navy2)}
.gx .gx-p{fill:var(--gold);stroke:var(--navy);stroke-width:2}
.gx .gx-p.hi{fill:var(--accent)}
.gx .gx-p.mine{fill:var(--gold)}
.gx .gx-p.ok{fill:var(--teal);stroke:var(--navy)}
.gx .gx-p.no{fill:var(--red);stroke:var(--navy)}
.gx .gx-p.rev{fill:none;stroke:var(--teal);stroke-width:3;stroke-dasharray:3 2}
.gx-slwrap{display:flex;align-items:center;gap:10px;margin:6px 0}
.gx-sl{flex:1;height:34px;accent-color:var(--accent)}
.gx-read{font-weight:600;margin:4px 0}
.gx-tab{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.gx-cell{border:2px solid var(--navy);border-radius:10px;padding:2px 10px;background:#fff;text-align:center;min-width:64px}
.gx-cell small{display:block;color:var(--mute);font-weight:600;font-size:.76em}
.gx-cell b{font-size:.98em}
</style>
</head>

      sample: (a, k) => R.shuffle(a).slice(0, k),
      chance: (p) => next() < p,
    };
    return R;
  };

  /* ---------- number helpers ---------- */
  MK.fmt = function (n) {
    // 1234567 -> "1,234,567" ; decimals kept
    if (typeof n !== 'number' || !isFinite(n)) return String(n);
    const neg = n < 0, a = Math.abs(n);
    const [i, d] = String(+a.toFixed(10)).split('.');
    const s = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '−' : '') + s + (d ? '.' + d : '');
  };
  MK.fact = function (n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
  MK.nPr = (n, r) => { let x = 1; for (let i = 0; i < r; i++) x *= (n - i); return x; };
  MK.nCr = (n, r) => { if (r < 0 || r > n) return 0; r = Math.min(r, n - r); let x = 1; for (let i = 1; i <= r; i++) x = (x * (n - r + i)) / i; return Math.round(x); };
  MK.gcd = (a, b) => (b ? MK.gcd(b, a % b) : Math.abs(a));
  MK.round = (x, d) => { const p = Math.pow(10, d || 0); return Math.round((x + Number.EPSILON) * p) / p; };
  MK.sci = (n) => MK.fmt(n);

  /* ---------- answer parser (no eval) ---------- */
  const SUP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
  function norm(s) {
    s = String(s == null ? '' : s).trim();
    s = s.replace(/[๐-๙]/g, (c) => String(c.charCodeAt(0) - 0x0e50));
    s = s.replace(/^\s*[a-zA-Zก-ฮ]\w{0,2}\s*=\s*/, ''); // "x = 4" -> "4"
    s = s.replace(/[−–—‒]/g, '-').replace(/[×·✕xX*]/g, '*').replace(/[÷:]/g, '/');
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, (m) => '^' + m.split('').map((c) => SUP[c]).join(''));

  MK.parseNum = function (str) {

    if (!s) return NaN;
    let i = 0;
    const peek = () => s[i];
    function num() {

      i += m[0].length;
      return parseFloat(m[0]);

    function primary() {
      let v;
      if (peek() === '(') { i++; v = expr(); if (peek() !== ')') throw 0; i++; }
      else v = num();
      while (peek() === '!') { i++; if (v < 0 || v > 170 || v !== Math.floor(v)) throw 0; v = MK.fact(v); }
      if (peek() === '%') { i++; v = v / 100; }

    }
    function unary() {
      if (peek() === '-') { i++; return -unary(); }
      if (peek() === '+') { i++; return unary(); }
      return primary();
    }
    function power() {
      const b = unary();
      if (peek() === '^') { i++; return Math.pow(b, power()); }
      return b;
    }
    function term() {
      let v = power();
      while (peek() === '*' || peek() === '/' || peek() === '(') {
        if (peek() === '(') { v *= power(); continue; } // implicit multiplication 2(3)
        const op = s[i++]; const r = power();
        v = op === '*' ? v * r : v / r;
      }
      return v;
    }
    function expr() {
      let v = term();
      while (peek() === '+' || peek() === '-') { const op = s[i++]; const r = term(); v = op === '+' ? v + r : v - r; }
      return v;
    }
    try { const v = expr(); return i === s.length && isFinite(v) ? v : NaN; } catch (e) { return NaN; }
  };
  MK.parseSet = function (str) {
    const parts = String(str || '').replace(/หรือ|และ|;|\//g, (m) => (m === '/' ? '/' : ',')).split(',').map((x) => x.trim()).filter(Boolean);
    return parts.map(MK.parseNum);
  };
  MK.numEq = (a, b, tol) => {
    if (!isFinite(a) || !isFinite(b)) return false;
    return Math.abs(a - b) <= (tol == null ? 1e-9 : tol) * Math.max(1, Math.abs(b));
  };
  // does the user's string match the field's expected answer?
  MK.matchAnswer = function (input, f) {
    if (f.set) {
      // set answers use ',' / 'หรือ' as separators (thousand separators not supported here)
      const raw = String(input || '').replace(/หรือ|และ|;/g, ',');
      const got = raw.split(',').map((x) => x.trim()).filter(Boolean).map(MK.parseNum);
      if (got.some((x) => !isFinite(x))) return false;
      const want = f.set.slice();
      if (got.length !== want.length) return false;
      return want.every((w) => got.some((x) => MK.numEq(x, w, f.tol)));
    }
    if (f.text) { // exact text (case/space-insensitive)
      const t = (x) => String(x).replace(/\s+/g, '').toLowerCase();
      return [].concat(f.text).some((a) => t(a) === t(input));
    }
    const v = MK.parseNum(input);
    if (!isFinite(v)) return false;
    if (f.prob) { // probability: any equivalent fraction, or a decimal/percent correctly rounded to >= 2 decimals
      const p = [].concat(f.answer)[0];
      if (Math.abs(v - p) <= 1e-9) return true;
      const t = String(input).trim().replace(/[๐-๙]/g, (c) => String(c.charCodeAt(0) - 0x0e50));
      const m = /^(\d*)\.(\d+)\s*(%?)$/.exec(t) || /^(\d+)()\s*(%)$/.exec(t);
      if (!m) return false;
      const d = m[2].length + (m[3] ? 2 : 0);
      return d >= 2 && Math.abs(v - p) <= 0.5 * Math.pow(10, -d) + 1e-12;
    }
    return [].concat(f.answer).some((a) => MK.numEq(v, a, f.tol));
  };

  /* ---------- question constructors (pure data) ---------- */
  const Q = (MK.Q = {});
  Q.choice = (o) => Object.assign({ type: 'choice', weight: 1, shuffle: true }, o);
  Q.tf = (o) => Q.choice(Object.assign({ options: ['ถูก', 'ผิด'], answer: o.answer ? 0 : 1, shuffle: false }, o, { answer: o.answer ? 0 : 1 }));
  Q.fill = (o) => Object.assign({ type: 'fill', weight: 1 }, o);
  Q.sort = (o) => Object.assign({ type: 'sort', weight: 2 }, o); // bins:[{id,label}], items:[{html,bin}]
  Q.pairs = (o) => Object.assign({ type: 'pairs', weight: 2 }, o); // left:[{html,key}], chips:[{html,key|null}]
  Q.order = (o) => Object.assign({ type: 'order', weight: 2 }, o);
  Q.find = (o) => Object.assign({ type: 'find', weight: 2 }, o);
  Q.group = (o) => Object.assign({ type: 'group', weight: null }, o); // story, parts:[Q]
  Q.tree = (o) => Object.assign({ type: 'tree', weight: 1 }, o);
  Q.custom = (o) => Object.assign({ type: 'custom', weight: 1 }, o);

  MK.weightOf = function (q) {
    if (q.type === 'group') return q.parts.reduce((s, p) => s + MK.weightOf(p), 0);
    return q.weight == null ? 1 : q.weight;
  };

  /* ---------- level helpers ---------- */
  MK.levelBuild = function (level, seed) {
    const R = MK.rng(seed);
    const qs = level.build(R);
    return qs;
  };

  MK.codeOf = function (str) {
    // 53-bit-ish string hash -> 8 base36 chars in groups of 4 (cyrb53)
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    const n = 4294967296 * (2097151 & h2) + (h1 >>> 0);
    const s = n.toString(36).toUpperCase().padStart(8, '0').slice(-8);
    return s.slice(0, 4) + '-' + s.slice(4);
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* shared brute-force helpers (used for generating-time cross checks and tests) */
(function (g) {
  'use strict';
  const MK = g.MK;
  // fractions
  MK.frac = (n, d) => { const g = MK.gcd(n, d) || 1; return [n / g, d / g]; };
  MK.fr = (n, d) => { const [a, b] = MK.frac(n, d); return b === 1 ? String(a) : '\\dfrac{' + a + '}{' + b + '}'; };
  MK.frs = (n, d) => { const [a, b] = MK.frac(n, d); return b === 1 ? String(a) : a + '/' + b; };
  const bf = (MK.bf = {});
  // visit all r-permutations (ordered, no repetition) of arr
  bf.eachRPerm = function (arr, r, cb) {
    const used = new Array(arr.length).fill(false), cur = [];
    (function go() {
      if (cur.length === r) { cb(cur.slice()); return; }
      for (let i = 0; i < arr.length; i++) { if (used[i]) continue; used[i] = true; cur.push(arr[i]); go(); cur.pop(); used[i] = false; }
    })();
  };
  bf.eachPerm = (arr, cb) => bf.eachRPerm(arr, arr.length, cb);
  // visit all r-subsets
  bf.eachComb = function (arr, r, cb) {
    const cur = [];
    (function go(s) {
      if (cur.length === r) { cb(cur.slice()); return; }
      for (let i = s; i < arr.length; i++) { cur.push(arr[i]); go(i + 1); cur.pop(); }
    })(0);
  };
  // number of distinct arrangements of a multiset {letter: count} by DFS with memo
  bf.distinct = function (counts) {
    const keys = Object.keys(counts);
    const memo = new Map();
    function f(c) {
      const k = c.join(',');
      if (memo.has(k)) return memo.get(k);
      const total = c.reduce((a, b) => a + b, 0);
      if (total === 0) return 1;
      let s = 0;
      for (let i = 0; i < c.length; i++) if (c[i] > 0) { c[i]--; s += f(c); c[i]++; }
      memo.set(k, s);
      return s;
    }
    return f(keys.map((k) => counts[k]));
  };
  bf.letterCounts = (w) => { const o = {}; for (const ch of w) o[ch] = (o[ch] || 0) + 1; return o; };
  bf.rangeCount = (lo, hi, pred) => { let c = 0; for (let n = lo; n <= hi; n++) if (pred(n)) c++; return c; };

<script>/* ===== MathKraft HW engine — reusable lab components (custom questions) ===== */
(function (g) {
  'use strict';
  const MK = g.MK, Q = MK.Q;
  const L = (MK.lab = {});

  /* ---------- helpers shared by labs ---------- */
  // two-try bookkeeping for a custom component: returns {fail(): bool done?, ok()}
  function tries(api, c, o) {
    let n = 0;
    return {
      get n() { return n; },
      // call when the student presses check; ok = answer correct
      submit(ok, wrongMsg) {
        n++;
        api.ctx.stats.tries++;
        if (ok) {
          const cr = n === 1 ? 1 : 0.5;
          api.ctx.stats.items++; if (cr === 1) api.ctx.stats.first++;
          return { done: true, credit: cr };
        }
        if (n >= 2) { api.ctx.stats.items++; return { done: true, credit: 0 }; }
        api.ctx.stats.hints++;
        return { done: false, credit: 0 };
      },
    };
  }
  L.tries = tries;

  /* ---------- F6 : sample-space builder ----------
     cfg = { title, cond, cells:[{id,label,off?,inE}], cols, rowHead?, colHead?, rows?, why, hint,

  L.sampleSpace = function (cfg) {
    const live = cfg.cells.filter((x) => !x.off);
    const nE = live.filter((x) => x.inE).length, nS = live.length;

      q: cfg.title, answer: nE, nS, verify: cfg.verify,
      mount(el, api, c) {
        const { h, R, fbSet, whyBox, rich } = api;

        const cellEl = {};

        const btn = h('button', { type: 'button', class: 'btn navy sm', text: 'ตรวจเหตุการณ์ ' + en });
        const clearBtn = h('button', { type: 'button', class: 'btn sm', text: 'ล้างที่เลือก' });
        function paint() {
          cnt.innerHTML = '';
          cnt.append(h('span', { text: 'เลือกแล้ว' }), h('b', { text: 'n(' + en + ') = ' + sel.size }), h('span', { text: '·' }), h('span', { text: 'ทั้งหมด' }), h('b', { text: 'n(S) = ' + nS }));
          live.forEach((x) => cellEl[x.id].classList.toggle('on', sel.has(x.id)));
        }
        function toggle(id) { if (c.done) return; if (sel.has(id)) sel.delete(id); else sel.add(id); fbSet(fb, '', ''); paint(); }
        if (cfg.rows) {
          // 2-D grid with headers

          for (let j = 0; j < cfg.cols; j++) grid.append(h('div', { class: 'ss-h', html: cfg.colHead[j] }));
          for (let i = 0; i < cfg.rows; i++) {
            grid.append(h('div', { class: 'ss-h', html: cfg.rowHead[i] }));
            for (let j = 0; j < cfg.cols; j++) {
              const x = cfg.cells[i * cfg.cols + j];
              if (x.off) { grid.append(h('div', { class: 'ss-cell off', 'aria-hidden': 'true', text: '–' })); continue; }
              const b = h('button', { type: 'button', class: 'ss-cell', text: x.label, 'aria-pressed': 'false', 'aria-label': x.aria || x.label, onclick: () => toggle(x.id) });
              cellEl[x.id] = b; grid.append(b);

          }
        } else {
          cfg.cells.forEach((x) => {
            const b = h('button', { type: 'button', class: 'ss-cell wide', text: x.label, 'aria-pressed': 'false', onclick: () => toggle(x.id) });
            cellEl[x.id] = b; grid.append(b);

          live.forEach((x) => {
            const b = cellEl[x.id];

            return;

          mark(true);

          fbSet(fb, r.credit ? 'ok' : 'no', r.credit === 1 ? 'ถูกต้องครบถ้วน! ' + sum : r.credit ? 'ถูกต้องแล้ว (ครั้งที่ 2) ' + sum : 'ครบ 2 ครั้งแล้ว ดูเฉลย: สีเขียว = ถูก, สีแดง = เลือกเกิน, ขอบประ = ที่ขาดไป · ' + sum);
          const w = whyBox(cfg.why, !r.credit || r.credit < 1);

          h('div', { class: 'mute', style: 'font-size:.86em;margin:2px 0 6px', html: cfg.how || 'แตะผลลัพธ์ทุกตัวที่ทำให้เหตุการณ์ ' + en + ' เกิดขึ้น (แตะซ้ำเพื่อยกเลิก)' }),
          h('div', { class: 'ss-wrap' }, grid), h('div', { class: 'row', style: 'margin:8px 0' }, cnt), h('div', { class: 'row' }, btn, clearBtn), fb);
        paint();
        c.dbg = {
          pick(right) { sel.clear(); live.forEach((x) => { if (right ? x.inE : !x.inE) sel.add(x.id); }); if (!right && !sel.size) sel.add(live[0].id); paint(); },

  /* ---------- Venn diagram (2 sets) ---------- */

  // shading lab: tasks = [{tex, set:[region ids], note}] done one after another (2 tries each)
  L.vennShade = function (cfg) {

    return Q.custom({
      q: '', weight: cfg.weight || 2, answer: tasks.map((x) => x.set.slice().sort().join(',')).join('|'), verify: cfg.verify,
      mount(el, api, c) {
        const { h, R, fbSet } = api;
        const credits = [];
        const log = h('div', { class: 'vlog' });
        const stage = h('div', {});
        el.append(R(cfg.title || '', 'div', 'qbody'), stage, log);
        let k = 0;
        function run() {
          const task = tasks[k];
          const T = tries(api, c);
          const sel = new Set();
          const wrap = h('div', { class: 'venn-wrap' });
          const fb = h('div', { class: 'fb' });
          const btn = h('button', { type: 'button', class: 'btn navy sm', text: 'ตรวจ' });

          function draw(extra) {

            if (!r.done) { fbSet(fb, 'hint', 'ยังไม่ถูก — ' + (cfg.hint || 'ลองแยกดูว่าแต่ละบริเวณอยู่ใน A หรือไม่ และอยู่ใน B หรือไม่') + ' (แก้แล้วถูกได้ครึ่งคะแนนของภาพนี้)'); return; }

            btn.disabled = true; clr.disabled = true;

            fbSet(fb, r.credit ? 'ok' : 'no', (r.credit === 1 ? 'ถูกต้อง! ' : r.credit ? 'ถูกต้องแล้ว (ครั้งที่ 2) ' : 'ครบ 2 ครั้งแล้ว ดูเฉลย: สีเขียว = ที่ควรแรเงา · ') + task.note);
            const nxt = h('button', { type: 'button', class: 'btn pri sm', text: k + 1 < tasks.length ? 'ภาพถัดไป →' : 'เสร็จสิ้น ✓' });
            nxt.addEventListener('click', () => {
              log.append(h('div', { class: 'vl' + (credits[k] === 1 ? ' ok' : credits[k] ? ' half' : ' no') }, (credits[k] === 1 ? '✓ ' : credits[k] ? '◐ ' : '✗ '), R(task.tex ? '\\(' + task.tex + '\\)' : '', 'span'), ' — ' + task.note));
              k++;
              if (k < tasks.length) { stage.innerHTML = ''; run(); }
              else { stage.innerHTML = ''; api.finish(credits.reduce((a, b) => a + b, 0) / tasks.length); }
            });

          }

          stage.append(R('<b>ภาพที่ ' + (k + 1) + ' / ' + tasks.length + '</b> · แตะแรเงาบริเวณของ \\(' + task.tex + '\\) (แตะซ้ำเพื่อยกเลิก)', 'div', 'rulebox'), wrap, h('div', { class: 'row', style: 'margin:6px 0' }, btn, clr), fb);
          draw();
          c.dbg = {
            fill: (right) => { sel.clear(); ['a', 'ab', 'b', 'n'].filter((x) => (right ? task.set.includes(x) : !task.set.includes(x))).forEach((x) => sel.add(x)); draw(); },
            check, next: () => { const b = stage.querySelector('.btn.pri'); if (b) b.click(); },
          };
        }
        run();
      },
      solve(c, wf) {
        for (let i = 0; i < tasks.length; i++) {
          if (wf) { c.dbg.fill(false); c.dbg.check(); }
          if (wf === 'twice') { c.dbg.fill(false); c.dbg.check(); } else { c.dbg.fill(true); c.dbg.check(); }
          c.dbg.next();
        }
      },
    });
  };

  /* ---------- F6 : simulation lab (law of large numbers) ----------
     cfg = { cond, p:[num,den], trial:(rng)=>bool, desc, ename }                                  */
  L.simLab = function (cfg) {
    const [pn, pd] = MK.frac(cfg.p[0], cfg.p[1]);
    const Pv = cfg.p[0] / cfg.p[1];
    const sizes = [10, 100, 1000];
    return Q.custom({
      q: '', weight: 3, answer: 'sim',
      verify: () => { const R = MK.rng(12345); let k = 0; const N = 40000; for (let i = 0; i < N; i++) if (cfg.trial(R)) k++; return Math.abs(k / N - Pv) < 0.015 ? 'sim' : 'bad:' + k / N; },
      mount(el, api, c) {
        const { h, R, fbSet, ctx, mountQ } = api;
        const en = cfg.ename || 'E';
        const runs = [];

        const tbody = h('tbody', {});
        const table = h('table', { class: 'lvtab simtab' }, h('thead', {}, h('tr', {}, h('th', { text: 'ทดลองกี่ครั้ง' }), h('th', { text: 'เกิด ' + en + ' กี่ครั้ง' }), h('th', { text: 'สัดส่วน' }), h('th', { text: 'ใกล้ ' + MK.frs(pn, pd) + ' แค่ไหน' }))), tbody);
        const msg = h('div', { class: 'mute', style: 'font-size:.88em;margin:6px 0' });
        const btns = sizes.map((n) => h('button', { type: 'button', class: 'btn sm', text: '🎲 ทดลอง ' + MK.fmt(n) + ' ครั้ง', onclick: () => run(n) }));
        const done = h('button', { type: 'button', class: 'btn pri sm hide', text: 'พอแล้ว ไปสรุปผลการทดลอง →' });
        const sub = h('div', { class: 'simsub' });
        function bar(prop) { return h('div', { class: 'simbar', title: 'เส้นขีด = ค่า P(' + en + ')' }, h('i', { style: 'width:' + (prop * 100).toFixed(1) + '%' }), h('b', { style: 'left:' + (Pv * 100).toFixed(1) + '%' })); }
        function run(n) {
          if (locked) return;
          let k = 0; for (let i = 0; i < n; i++) if (cfg.trial(ctx.R)) k++;
          runs.push({ n, k });
          const prop = k / n;
          tbody.append(h('tr', {}, h('td', { class: 'num', text: MK.fmt(n) }), h('td', { class: 'num', text: MK.fmt(k) }), h('td', { class: 'num', text: prop.toFixed(3) }), h('td', {}, bar(prop))));
          while (tbody.children.length > 9) tbody.removeChild(tbody.firstChild);
          const have = sizes.filter((x) => runs.some((r) => r.n === x));
          msg.textContent = have.length < 3 ? 'ยังต้องทดลองขนาด ' + sizes.filter((x) => !have.includes(x)).map(MK.fmt).join(', ') + ' ครั้งให้ครบก่อน (ทดลองซ้ำกี่รอบก็ได้)' : 'ครบแล้ว! ทดลองซ้ำเพิ่มดูได้ เมื่อพร้อมกด “ไปสรุปผล”';

        function lock() {

          locked = true; btns.forEach((b) => (b.disabled = true)); done.disabled = true;
          const last = sizes.map((n) => { const rr = runs.filter((x) => x.n === n).pop(); return { n, d: Math.abs(rr.k / rr.n - Pv), prop: rr.k / rr.n }; });
          const mn = Math.min(...last.map((x) => x.d));
          const winners = last.filter((x) => Math.abs(x.d - mn) < 1e-12);
          const opts1 = last.map((x) => 'ทดลอง ' + MK.fmt(x.n) + ' ครั้ง (สัดส่วน ' + x.prop.toFixed(3) + ')').concat(['มีมากกว่าหนึ่งรอบที่ห่างจาก P(' + en + ') เท่ากัน']);
          const q1 = Q.choice({ q: r2('จากการทดลอง<b>รอบล่าสุดของแต่ละขนาด</b>ในตารางของคุณ รอบใดที่สัดส่วนที่ได้ <b>ใกล้ \\(P(' + en + ')=' + MK.fr(pn, pd) + '\\)</b> มากที่สุด'), options: opts1, shuffle: false, answer: winners.length > 1 ? 3 : last.indexOf(winners[0]),
            why: 'ความห่างจาก P(' + en + ') ของรอบล่าสุด: ' + last.map((x) => MK.fmt(x.n) + ' ครั้ง → ' + x.d.toFixed(4)).join(' · ') + ' (เลือกรอบที่ค่านี้น้อยที่สุด) การทดลองเป็นการสุ่ม ผลแต่ละรอบจึงไม่เหมือนกันและบางครั้งรอบน้อยครั้งอาจบังเอิญใกล้กว่า' });
          const q2 = Q.choice({ q: r2('เมื่อทำการทดลองซ้ำเป็นจำนวนครั้ง<b>มากขึ้น ๆ</b> สัดส่วนที่ได้จากการทดลองมีแนวโน้มอย่างไรกับ \\(P(' + en + ')\\)'),
            options: ['เข้าใกล้ \\(P(' + en + ')\\) มากขึ้น แต่ไม่จำเป็นต้องเท่ากับ \\(P(' + en + ')\\) พอดี', 'เท่ากับ \\(P(' + en + ')\\) พอดีเสมอ', 'ห่างจาก \\(P(' + en + ')\\) มากขึ้นเรื่อย ๆ', 'ไม่มีความเกี่ยวข้องกับ \\(P(' + en + ')\\)'], answer: 0,
            why: 'เมื่อทดลองซ้ำมาก ๆ สัดส่วนที่ได้จากการทดลองมีแนวโน้มเข้าใกล้ความน่าจะเป็นตามทฤษฎี แต่ไม่ได้รับประกันว่าจะเท่ากันพอดี' });
          const q3 = Q.choice({ q: r2('นักเรียนคนหนึ่งกล่าวว่า “เมื่อ \\(P(' + en + ')=' + MK.fr(pn, pd) + '\\) แปลว่าถ้าทดลอง ' + pd + ' ครั้ง ต้องเกิด ' + en + ' พอดี ' + pn + ' ครั้งเสมอ” ข้อใดถูกต้อง'),
            options: ['ไม่จริงเสมอไป \\(P(' + en + ')\\) บอกแนวโน้มเมื่อทำซ้ำมาก ๆ ไม่ได้รับประกันผลของการทดลองชุดสั้น ๆ', 'จริงเสมอ เพราะความน่าจะเป็นกำหนดผลไว้แล้ว', 'จริงเฉพาะเมื่อทดลองด้วยอุปกรณ์ที่ยุติธรรม', 'จริง ถ้าทดลองครบ ' + pd + ' ครั้งติดต่อกันโดยไม่หยุดพัก'], answer: 0,
            why: 'ผลของการทดลองแต่ละชุดเป็นการสุ่ม (ดูตารางของคุณ สัดส่วนจากรอบต่าง ๆ ไม่เท่ากัน) ความน่าจะเป็นบอกว่า “คาดว่าจะเกินประมาณเท่าไร” ในระยะยาว ไม่ใช่ผลที่แน่นอน' });
          const qs = [q1, q2, q3], cs = [], credits = [];
          function next(i) {
            const sc = mountQ(qs[i], ctx);
            cs.push(sc);
            const wrap = h('div', { class: 'subq' }, h('div', { class: 'sl', text: 'สรุปผล ' + (i + 1) + ' / 3' }), sc.el);
            sub.appendChild(wrap);
            sc.onDone = () => { credits.push(sc.credit); if (i + 1 < qs.length) next(i + 1); else api.finish(credits.reduce((a, b) => a + b, 0) / qs.length); };
          }
          next(0);
          c.sub = cs;
        }
        done.addEventListener('click', lock);
        el.append(R(cfg.desc, 'div', 'qbody'), h('div', { class: 'rulebox' }, h('b', { text: 'เหตุการณ์ ' + en + ' : ' }), R(cfg.cond + ' · ความน่าจะเป็นตามทฤษฎี \\(P(' + en + ')=' + MK.fr(pn, pd) + '\\) (ขีดสีน้ำเงินในแถบ)', 'span')),
          h('div', { class: 'row', style: 'margin:6px 0' }, btns), table, msg, h('div', { class: 'row' }, done), sub);
        msg.textContent = 'กดปุ่มทดลองทั้ง 3 ขนาดอย่างน้อยขนาดละ 1 รอบ (ทดลองซ้ำเพิ่มได้) แล้วสังเกตสัดส่วนที่ได้';
        c.dbg = {
          runAll() { sizes.forEach((n) => run(n)); },
          lock,
          answerCurrent(wrong) {
            const sc = c.sub[c.sub.length - 1];
            if (!sc || sc.done) return false;
            const pos = wrong ? sc.order.findIndex((o) => o !== sc.q.answer) : sc.order.indexOf(sc.q.answer);
            sc.el.querySelectorAll('.opt')[pos].click();

          },

      },
      solve(c, wf) {
        c.dbg.runAll(); c.dbg.lock();

  const r2 = (s) => s;

  /* ---------- coordinate plane (static SVG string) ---------- */
  // o: {xmin,xmax,ymin,ymax,w,h,xstep,ystep,minorY, curves:[{f,cls,dash,label,lx,dy}], pts:[{x,y,cls,label,dx,dy}], vlines:[x], hlines:[y], diag, fmtY}
  L.graph = function (o) {
    const W = o.w || 320, H = o.h || 260, ml = 36, mr = 12, mt = 12, mb = 26;
    const X = (x) => ml + ((x - o.xmin) / (o.xmax - o.xmin)) * (W - ml - mr);
    const Y = (y) => mt + ((o.ymax - y) / (o.ymax - o.ymin)) * (H - mt - mb);
    const f1 = (v) => (+v.toFixed(2)).toString().replace('-', '−');
    let g = '';
    const xs = o.xstep || 1, ys = o.ystep || 1;
    for (let x = Math.ceil(o.xmin / xs) * xs; x <= o.xmax + 1e-9; x += xs) g += '<line class="gx-g" x1="' + X(x) + '" x2="' + X(x) + '" y1="' + Y(o.ymin) + '" y2="' + Y(o.ymax) + '"/>';
    for (let y = Math.ceil(o.ymin / ys) * ys; y <= o.ymax + 1e-9; y += ys) g += '<line class="gx-g" y1="' + Y(y) + '" y2="' + Y(y) + '" x1="' + X(o.xmin) + '" x2="' + X(o.xmax) + '"/>';
    if (o.minorY) for (let y = Math.ceil(o.ymin / o.minorY) * o.minorY; y <= o.ymax + 1e-9; y += o.minorY) g += '<line class="gx-m" y1="' + Y(y) + '" y2="' + Y(y) + '" x1="' + X(o.xmin) + '" x2="' + X(o.xmax) + '"/>';
    // axes
    if (o.xmin <= 0 && o.xmax >= 0) g += '<line class="gx-a" x1="' + X(0) + '" x2="' + X(0) + '" y1="' + Y(o.ymin) + '" y2="' + Y(o.ymax) + '"/>';
    if (o.ymin <= 0 && o.ymax >= 0) g += '<line class="gx-a" y1="' + Y(0) + '" y2="' + Y(0) + '" x1="' + X(o.xmin) + '" x2="' + X(o.xmax) + '"/>';
    // tick labels
    const ax = o.ymin <= 0 && o.ymax >= 0 ? Y(0) : Y(o.ymin), ay = o.xmin <= 0 && o.xmax >= 0 ? X(0) : X(o.xmin);
    for (let x = Math.ceil(o.xmin / xs) * xs; x <= o.xmax + 1e-9; x += xs) if (Math.abs(x) > 1e-9) g += '<text class="gx-t" x="' + X(x) + '" y="' + (Math.min(ax, Y(o.ymin)) + 14) + '" text-anchor="middle">' + f1(x) + '</text>';
    for (let y = Math.ceil(o.ymin / ys) * ys; y <= o.ymax + 1e-9; y += ys) if (Math.abs(y) > 1e-9) g += '<text class="gx-t" x="' + (ay - 5) + '" y="' + (Y(y) + 4) + '" text-anchor="end">' + (o.fmtY ? o.fmtY(y) : f1(y)) + '</text>';
    g += '<text class="gx-t" x="' + (ay - 5) + '" y="' + (ax + 14) + '" text-anchor="end">0</text>';
    (o.vlines || []).forEach((x) => (g += '<line class="gx-as" x1="' + X(x) + '" x2="' + X(x) + '" y1="' + Y(o.ymin) + '" y2="' + Y(o.ymax) + '"/>'));
    (o.hlines || []).forEach((y) => (g += '<line class="gx-as" y1="' + Y(y) + '" y2="' + Y(y) + '" x1="' + X(o.xmin) + '" x2="' + X(o.xmax) + '"/>'));
    if (o.diag) g += '<line class="gx-as" x1="' + X(Math.max(o.xmin, o.ymin)) + '" y1="' + Y(Math.max(o.xmin, o.ymin)) + '" x2="' + X(Math.min(o.xmax, o.ymax)) + '" y2="' + Y(Math.min(o.xmax, o.ymax)) + '"/>';
    (o.curves || []).forEach((cv) => {
      const N = 240; let d = '', pen = false;
      for (let i = 0; i <= N; i++) {
        const t = cv.xmin != null && cv.xmax != null ? cv.xmin + ((cv.xmax - cv.xmin) * i) / N : o.xmin + ((o.xmax - o.xmin) * i) / N;
        let x = t, y;
        if (cv.xy) { const p = cv.xy(t); x = p[0]; y = p[1]; } else y = cv.f(x);
        if (!isFinite(x) || !isFinite(y) || y < o.ymin - 0.02 || y > o.ymax + 0.02 || x < o.xmin - 0.02 || x > o.xmax + 0.02) { pen = false; continue; }
        d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1); pen = true;
      }
      g += '<path class="gx-c ' + (cv.cls || 'c0') + '"' + (cv.dash ? ' stroke-dasharray="7 5"' : '') + ' d="' + d + '"/>';
      if (cv.label) { const lx = cv.lx != null ? cv.lx : o.xmax - 0.4; g += '<text class="gx-l ' + (cv.cls || 'c0') + '" x="' + (X(lx) + (cv.dx || 0)) + '" y="' + (Y(cv.f(lx)) + (cv.dy != null ? cv.dy : -6)) + '" text-anchor="middle">' + cv.label + '</text>'; }
    });
    (o.pts || []).forEach((p) => { g += '<circle class="gx-p ' + (p.cls || '') + '" cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="' + (p.r || 5) + '"/>'; if (p.label) g += '<text class="gx-t b" x="' + (X(p.x) + (p.dx != null ? p.dx : 8)) + '" y="' + (Y(p.y) + (p.dy != null ? p.dy : -8)) + '">' + p.label + '</text>'; });
    const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="gx" xmlns="http://www.w3.org/2000/svg" role="img">' + (o.inner || '') + g + '</svg>';
    return { svg, X, Y, W, H, ml, mr, mt, mb, inv: (px, py) => ({ x: o.xmin + ((px - ml) / (W - ml - mr)) * (o.xmax - o.xmin), y: o.ymax - ((py - mt) / (H - mt - mb)) * (o.ymax - o.ymin) }) };
  };

  // follow-up question chain used by labs
  function chain(api, c, qs, host, label) {
    const { h, ctx, mountQ } = api; const cs = [], credits = [];
    (function next(i) {
      const sc = mountQ(qs[i], ctx); cs.push(sc);
      host.appendChild(h('div', { class: 'subq' }, h('div', { class: 'sl', text: (label || 'สรุปผล') + ' ' + (i + 1) + ' / ' + qs.length }), sc.el));
      sc.onDone = () => { credits.push(sc.credit); if (i + 1 < qs.length) next(i + 1); else api.finish(credits.reduce((a, b) => a + b, 0) / qs.length); };
    })(0);
    c.sub = cs;
  }
  // debug helper: answer the currently open sub-question
  function answerSub(c, wf) {
    const sc = c.sub[c.sub.length - 1];
    if (!sc || sc.done) return false;
    const q = sc.q;
    if (q.type === 'choice') {
      const pos = wf ? sc.order.findIndex((o) => o !== q.answer) : sc.order.indexOf(q.answer);
      sc.el.querySelectorAll('.opt')[pos].click(); return true;
    }
    if (q.type === 'fill') {
      const fields = q.fields || [{ answer: q.answer, set: q.set, text: q.text }];
      const val = (f) => (f.set ? f.set.join(', ') : f.text ? [].concat(f.text)[0] : String([].concat(f.answer)[0]));
      const btn = [...sc.el.querySelectorAll('button')].find((b) => /ตรวจ/.test(b.textContent));
      if (wf) { sc.inputs.forEach((i) => (i.value = '987654')); btn.click(); }
      if (wf === 'twice') { sc.inputs.forEach((i) => { if (!i.readOnly) i.value = '987655'; }); btn.click(); return true; }
      sc.inputs.forEach((i, k) => { if (!i.readOnly) i.value = val(fields[k]); }); btn.click(); return true;
    }
    throw new Error('answerSub: unsupported ' + q.type);
  }
  L.chain = chain; L.answerSub = answerSub;

  /* ---------- F6 : exponential graph lab (slider for a) ---------- */
  // cfg = { desc, qs:[Q], vals:[numbers excluding 1], labels?:[strings], fn:(a,x)=>y }
  L.expLab = function (cfg) {
    const vals = cfg.vals, lab = cfg.labels || vals.map((v) => String(v));
    const fn = cfg.fn || ((a, x) => Math.pow(a, x));
    return Q.custom({
      q: '', weight: cfg.qs.length, answer: 'lab', verify: () => (vals.every((v) => v > 0 && v !== 1) && cfg.qs.length ? 'lab' : 'bad'),
      mount(el, api, c) {
        const { h, R } = api;
        let idx = vals.findIndex((v) => v === 2); if (idx < 0) idx = 0;
        const seen = new Set([idx]);
        const wrap = h('div', { class: 'gx-wrap' });
        const readout = h('div', { class: 'gx-read' });
        const tab = h('div', { class: 'gx-tab' });
        const msg = h('div', { class: 'mute', style: 'font-size:.88em;margin:6px 0' });
        const sub = h('div', { class: 'simsub' });
        const done = h('button', { type: 'button', class: 'btn pri sm hide', text: 'สำรวจพอแล้ว ไปสรุปผล →' });
        const sl = h('input', { type: 'range', min: 0, max: vals.length - 1, step: 1, value: idx, class: 'gx-sl', 'aria-label': 'ค่า a' });
        let locked = false;
        function draw() {
          const a = vals[idx];
          const g = L.graph(Object.assign({ xmin: -3, xmax: 3, ymin: -0.5, ymax: 8.5, ystep: 1, curves: [{ f: (x) => fn(a, x), cls: 'c0' }], hlines: [], pts: [{ x: 0, y: fn(a, 0), cls: 'hi', label: '(0, 1)', dx: 8, dy: -9, r: 6 }] }, cfg.opts ? cfg.opts(a) : {}));
          wrap.innerHTML = g.svg;
          readout.innerHTML = rich2(cfg.readout ? cfg.readout(a, lab[idx]) : 'ค่า \\(a=' + lab[idx] + '\\) · กราฟของ \\(y=' + (lab[idx].includes('\\') ? '\\left(' + lab[idx] + '\\right)' : lab[idx]) + '^{x}\\)');
          tab.innerHTML = '';
          if (cfg.table) cfg.table(a).forEach(([s, b]) => tab.append(h('div', { class: 'gx-cell' }, h('small', { text: s }), h('b', { text: b }))));
          else [-2, -1, 0, 1, 2].forEach((x) => { const y = fn(a, x); tab.append(h('div', { class: 'gx-cell' }, h('small', { text: 'x = ' + String(x).replace('-', '−') }), h('b', { text: String(+y.toFixed(3)) }))); });
        }
        function rich2(t) { return api.rich(t); }
        function update() {
          idx = +sl.value; seen.add(idx); draw();
          const lo = [...seen].filter((i) => vals[i] < 1).length, hi = [...seen].filter((i) => vals[i] > 1).length;
          const ok = lo >= 2 && hi >= 2;
          msg.textContent = ok ? 'สำรวจครบแล้ว! ลองเลื่อนดูเพิ่มได้ เมื่อพร้อมกด “ไปสรุปผล”' : 'เลื่อนแถบเพื่อเปลี่ยนค่า a — ลองดูค่า a ที่ น้อยกว่า 1 อย่างน้อย 2 ค่า (' + Math.min(lo, 2) + '/2) และมากกว่า 1 อย่างน้อย 2 ค่า (' + Math.min(hi, 2) + '/2)';
          done.classList.toggle('hide', !ok);
        }
        sl.addEventListener('input', () => { if (!locked) update(); });
        sl.addEventListener('change', () => { if (!locked) update(); });
        done.addEventListener('click', () => { if (locked) return; locked = true; sl.disabled = true; done.disabled = true; chain(api, c, cfg.qs, sub); });
        el.append(R(cfg.desc, 'div', 'qbody'), h('div', { class: 'gx-slwrap' }, h('span', { class: 'mute', text: 'a น้อย' }), sl, h('span', { class: 'mute', text: 'a มาก' })), readout, wrap, tab, msg, h('div', { class: 'row' }, done), sub);
        draw(); update();
        c.dbg = {
          sweep() { locked || [0, 1, vals.length - 2, vals.length - 1].forEach((i) => { sl.value = i; sl.dispatchEvent(new Event('input')); }); },
          lock() { done.click(); },
          answer: (wf) => answerSub(c, wf),
        };
      },
      solve(c, wf) { c.dbg.sweep(); c.dbg.lock(); for (let i = 0; i < cfg.qs.length; i++) c.dbg.answer(wf); },
    });
  };

  /* ---------- F9 : plot points from a value table ---------- */
  // cfg = { a:[num,den], xs:[...], ymax, why }
  L.plotPoints = function (cfg) {
    const a = cfg.a[0] / cfg.a[1], xs = cfg.xs, ymax = cfg.ymax || 4.5;
    const truth = xs.map((x) => Math.pow(a, x));
    return Q.custom({
      q: '', weight: 2, answer: truth.join(','), verify: () => xs.map((x) => Math.pow(cfg.a[0], x) / Math.pow(cfg.a[1], x)).join(','),
      mount(el, api, c) {
        const { h, R, fbSet, whyBox, rich } = api;
        const T = tries(api, c);
        const pl = L.graph({ xmin: -3, xmax: 3, ymin: -0.5, ymax, ystep: 1, minorY: 0.25, w: 320, h: 300 });
        const mine = {}; // x -> y
        const wrap = h('div', { class: 'gx-wrap plot', style: 'touch-action:manipulation' });
        const fb = h('div', { class: 'fb' });
        const btn = h('button', { type: 'button', class: 'btn navy sm', text: 'ตรวจจุดที่วาง' });
        const clr = h('button', { type: 'button', class: 'btn sm', text: 'ล้างจุด' });
        let result = null;
        function frac(y) { const r = (n, d) => '\\dfrac{' + n + '}{' + d + '}'; const q = Math.round(y * 4); return q % 4 === 0 ? String(q / 4) : q % 2 === 0 ? r(q / 2, 2) : r(q, 4); }
        const table = h('div', { class: 'gx-tab' });
        xs.forEach((x, i) => table.append(h('div', { class: 'gx-cell' }, h('small', { text: 'x = ' + String(x).replace('-', '−') }), R('\\(' + frac(truth[i]) + '\\)', 'b'))));
        function draw() {
          const pts = xs.filter((x) => mine[x] != null).map((x) => ({ x, y: mine[x], cls: result ? (Math.abs(mine[x] - Math.pow(a, x)) < 1e-6 ? 'ok' : 'no') : 'mine', r: 6 }));
          const extra = result && result.reveal ? xs.map((x) => ({ x, y: Math.pow(a, x), cls: 'rev', r: 6 })) : [];
          const curve = result && result.curve ? [{ f: (x) => Math.pow(a, x), cls: 'c0' }] : [];
          wrap.innerHTML = L.graph({ xmin: -3, xmax: 3, ymin: -0.5, ymax, ystep: 1, minorY: 0.25, w: 320, h: 300, pts: extra.concat(pts), curves: curve }).svg;
        }
        function put(px, py) {
          if (c.done) return;
          const svg = wrap.querySelector('svg'); const r = svg.getBoundingClientRect();
          const sx = 320 / r.width, sy = 300 / r.height;
          const d = pl.inv((px - r.left) * sx, (py - r.top) * sy);
          const x = xs.reduce((b, v) => (Math.abs(v - d.x) < Math.abs(b - d.x) ? v : b), xs[0]);
          if (Math.abs(x - d.x) > 0.5) return;
          const y = Math.min(ymax, Math.max(0, Math.round(d.y * 4) / 4));
          mine[x] = y; fbSet(fb, '', ''); draw();
        }
        wrap.addEventListener('click', (e) => put(e.clientX, e.clientY));
        function check() {
          if (c.done) return;
          if (xs.some((x) => mine[x] == null)) { fbSet(fb, 'hint', 'วางจุดให้ครบทั้ง ' + xs.length + ' จุด (หนึ่งจุดต่อหนึ่งค่า x) ก่อนกดตรวจ'); return; }
          const bad = xs.filter((x) => Math.abs(mine[x] - Math.pow(a, x)) > 1e-6);
          const r = T.submit(!bad.length);
          if (!r.done) { fbSet(fb, 'hint', 'ยังผิด ' + bad.length + ' จุด (ที่ x = ' + bad.map((x) => String(x).replace('-', '−')).join(', ') + ') — อ่านค่า y จากตารางแล้วหาตำแหน่งบนแกน y ให้ตรง · เส้นจางทุก 0.25 หน่วย (แก้แล้วถูกได้ครึ่งคะแนน)'); result = { mark: true }; draw(); result = null; return; }
          btn.disabled = true; clr.disabled = true; result = { curve: !!r.credit, reveal: !r.credit }; draw();
          fbSet(fb, r.credit ? 'ok' : 'no', r.credit === 1 ? 'ถูกต้องทุกจุด! เส้นโค้งที่ผ่านจุดเหล่านี้คือกราฟของฟังก์ชัน' : r.credit ? 'ถูกต้องแล้ว (ครั้งที่ 2) ได้ครึ่งคะแนน' : 'ครบ 2 ครั้งแล้ว ดูตำแหน่งที่ถูกต้อง (จุดขอบเขียว) ในกราฟ');
          const w = whyBox(cfg.why, !r.credit || r.credit < 1); if (w) el.appendChild(w);
          api.finish(r.credit);
        }
        btn.addEventListener('click', check);
        clr.addEventListener('click', () => { if (c.done) return; xs.forEach((x) => delete mine[x]); fbSet(fb, '', ''); draw(); });
        el.append(R(cfg.title, 'div', 'qbody'), table, h('div', { class: 'mute', style: 'font-size:.86em;margin:6px 0' }, 'แตะบนกราฟเพื่อวางจุดของแต่ละค่า x (แตะซ้ำที่คอลัมน์เดิมเพื่อย้ายจุด)'), wrap, h('div', { class: 'row', style: 'margin:6px 0' }, btn, clr), fb);
        draw();
        c.dbg = { fill(right) { xs.forEach((x, i) => { mine[x] = right ? Math.pow(a, x) : Math.min(ymax, Math.pow(a, x) + 1.5 > ymax ? Math.max(0, Math.pow(a, x) - 1.5) : Math.pow(a, x) + 1.5); }); draw(); }, check };
      },
      solve(c, wf) {
        if (wf) { c.dbg.fill(false); c.dbg.check(); }
        if (wf === 'twice') { c.dbg.fill(false); c.dbg.check(); } else { c.dbg.fill(true); c.dbg.check(); }
      },
    });
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script id="mathkraft-content">
/* =====================================================================
 * MathKraft Homework Template (แม่แบบแบบฝึกหัดมาตรฐาน)

 * 3. สมการคณิตศาสตร์:

 *    - Display math (แยกบรรทัด): เขียนด้วย $$สูตร$$ เช่น $$S_n = \frac{n}{2}(a_1 + a_n)$$
 * 4. นำไปให้ Claude หรือ AI เจนเนอเรต: นำไฟล์นี้แนบใน Prompt แล้วสั่งให้ AI แก้ไขเฉพาะส่วนโจทย์
 * ===================================================================== */
(function () {
  'use strict';
  const MK = window.MK, Q = MK.Q;
  const r = String.raw; // เก็บเครื่องหมาย \ ของ LaTeX โดยไม่ต้องเบิ้ลสแลช

  /* ===================================================================
   * 1. ฟังก์ชันสร้างโจทย์แต่ละรูปแบบ (Question Type Generators)
   *    ทุกฟังก์ชันรับ R (Random generator พร้อม seed ของผู้เรียนแต่ละคน)
   * =================================================================== */

  /**
   * [รูปแบบที่ 1: Q.choice] ข้อเลือกตอบ (ปรนัย 4 ตัวเลือก)
   * เหมาะสำหรับ: นิยาม, ความเข้าใจ, เลือกสมการหรือผลลัพธ์ที่ถูกต้อง
   */
  function qChoice(R) {
    const a = R.int(2, 6);
    const n = R.int(2, 5);
    const ans = Math.pow(a, n);
    const wrongs = [
      Math.pow(a, n - 1),
      Math.pow(a, n + 1),
      a * n
    ];
    // answer คือ index ของตัวเลือกที่ถูกใน options ก่อนที่ระบบจะสลับลำดับอัตโนมัติ
    return Q.choice({
      q: `ค่าของ $${a}^{${n}}$ มีค่าเท่ากับข้อใด`,
      options: [
        `$${ans}$`,
        `$${wrongs[0]}$`,
        `$${wrongs[1]}$`,
        `$${wrongs[2]}$`
      ],
      answer: 0, // ชี้ไปที่ตัวเลือกแรก (ans)
      hint: `ให้นำ $${a}$ มาคูณกันจำนวน $${n}$ ตัว`,
      why: `$${a}^{${n}} = ${Array(n).fill(a).join(' \\times ')} = ${ans}$`,
      verify: () => 0 // selftest จะเทียบคำตอบที่เลือกกับค่าที่ verify ส่งคืน
    });
  }

  /**
   * [รูปแบบที่ 2: Q.fill] ข้อเติมคำตอบ (ตัวเลขหรือข้อความสั้น)
   * เหมาะสำหรับ: การคำนวณตัวเลข, หาพจน์, หาผลลัพธ์สุดท้าย
   */
  function qFill(R) {
    const a1 = R.int(2, 8);
    const d = R.int(3, 7);
    const n = R.int(4, 9);
    const an = a1 + (n - 1) * d;

    return Q.fill({
      q: `กำหนดลำดับเลขคณิตที่มี $a_1 = ${a1}$ และผลต่างร่วม $d = ${d}$ จงหาค่าของพจน์ที่ <b>$a_{${n}}$</b>`,
      fields: [
        {
          label: `$a_{${n}} =$`,
          answer: an,          // คำตอบที่ถูกต้อง
          unit: '',            // หน่วย (ถ้ามี เช่น 'บาท', 'คน', หรือเว้นว่าง)
          tol: 0,              // ค่าความคลาดเคลื่อนที่ยอมรับได้ (สำหรับทศนิยม)
          ph: 'พิมพ์ตัวเลข'    // placeholder ในช่องกรอก
        }
      ],
      hint: `ใช้สูตรพจน์ทั่วไปของลำดับเลขคณิต $a_n = a_1 + (n-1)d$`,
      why: `จากสูตร $a_n = a_1 + (n-1)d$<br>` +
           `แทนค่า: $a_{${n}} = ${a1} + (${n}-1)(${d}) = ${a1} + (${n - 1})(${d}) = ${an}$`,
      verify: () => an
    });
  }

  /**
   * [รูปแบบที่ 3: Q.sort] จัดกลุ่มการ์ด (Drag & Drop หรือแตะเลือกการ์ดลงกล่อง)
   * เหมาะสำหรับ: การจำแนกประเภท (เช่น ลำดับจำกัด vs ลำดับอนันต์, เลขคณิต vs เรขาคณิต)
   */
  function qSort(R) {
    const limN = R.int(10, 50);
    return Q.sort({
      q: `ลากการ์ดข้อความด้านล่างไปวางในกลุ่มที่ถูกต้อง`,
      bins: [
        { id: 'fin', label: 'ลำดับจำกัด' },
        { id: 'inf', label: 'ลำดับอนันต์' }
      ],
      items: [
        { html: `$1, 2, 3, \\dots, ${limN}$`, bin: 'fin' },
        { html: `$a_n = 2n + 1$ เมื่อ $n \\in \\{1, 2, 3, 4\\}$`, bin: 'fin' },
        { html: `$2, 4, 8, 16, \\dots$`, bin: 'inf' },
        { html: `$a_n = 3n - 5$ เมื่อ $n$ เป็นจำนวนนับ`, bin: 'inf' }
      ],
      hint: `ลำดับที่มีจำนวนพจน์แน่นอนคือลำดับจำกัด ส่วนลำดับที่มีพจน์ต่อไปได้เรื่อย ๆ ไม่สิ้นสุดคือลำดับอนันต์`,
      why: `ลำดับที่ระบุพจน์สุดท้ายหรือกำหนดขอบเขต $n$ แน่นอนเป็น <b>ลำดับจำกัด</b> ส่วนลำดับที่มีเครื่องหมาย $\\dots$ ต่อท้ายโดยไม่มีพจน์สุดท้ายเป็น <b>ลำดับอนันต์</b>`
    });
  }

  /**
   * [รูปแบบที่ 4: Q.pairs] จับคู่ 1 ต่อ 1 (Matching pairs)
   * เหมาะสำหรับ: จับคู่สูตรกับนิยาม, จับคู่ฟังก์ชันกับกราฟ, จับคู่โจทย์กับคำตอบ
   */
  function qPairs(R) {
    const a = R.int(2, 5);
    const b = R.int(2, 5);
    const sum = a + b;
    const diff = a - b;
    const prod = a * b;

    return Q.pairs({
      q: `จับคู่นิพจน์ทางซ้ายมือกับผลลัพธ์ที่ถูกต้องทางขวามือ`,
      left: [
        { key: 'p1', html: `$${a} + ${b}$` },
        { key: 'p2', html: `$${a} - ${b}$` },
        { key: 'p3', html: `$${a} \\times ${b}$` }
      ],
      chips: [
        { key: 'p1', html: `$${sum}$` },
        { key: 'p2', html: `$${diff}$` },
        { key: 'p3', html: `$${prod}$` }
      ],
      hint: `คำนวณผลลัพธ์แต่ละคู่แล้วลากไปวางในช่องที่ตรงกัน`,
      why: `$${a} + ${b} = ${sum}$, $${a} - ${b} = ${diff}$, $${a} \\times ${b} = ${prod}$`
    });
  }

  /**
   * [รูปแบบที่ 5: Q.order] เรียงลำดับขั้นตอนและเลือกเหตุผล (Proof / Step Ordering)
   * เหมาะสำหรับ: การพิสูจน์ทางคณิตศาสตร์, แสดงวิธีทำตามลำดับขั้นตอน
   */
  function qOrder(R) {
    const a = R.int(2, 5);
    const b = R.int(3, 8);
    const c = a * R.int(2, 6) + b;
    const ans = (c - b) / a;

    return Q.order({
      q: `เรียงลำดับขั้นตอนการแก้สมการ $${a}x + ${b} = ${c}$ ให้ถูกต้อง พร้อมเลือกเหตุผลกำกับ`,
      steps: [
        { html: `จากสมการเริ่มต้น $${a}x + ${b} = ${c}$`, reason: 0 },
        { html: `$${a}x = ${c} - ${b} = ${c - b}$`, reason: 1 },
        { html: `$x = \\frac{${c - b}}{${a}} = ${ans}$`, reason: 2 }
      ],
      reasons: [
        'กำหนดให้จากโจทย์',
        'สมบัติการเท่ากันของการลบ (ย้ายค่าคงตัวไปลบ)',
        'สมบัติการเท่ากันของการหาร (หารด้วยสัมประสิทธิ์หน้า x)'
      ],
      hint: `เริ่มจากโจทย์ ย้ายตัวเลขคงที่ไปลบออกก่อน แล้วจึงหารด้วยสัมประสิทธิ์หน้า $x$`,
      why: `ขั้นตอนการแก้สมการเชิงเส้นตัวแปรเดียวต้องกำจัดพจน์คงตัวก่อน แล้วจึงหาค่าตัวแปร`
    });
  }

  /**
   * [รูปแบบที่ 6: Q.find] จับผิดวิธีทำ (Find the Error)
   * เหมาะสำหรับ: ด่านพัฒนาทักษะกระบวนการ (P), วิเคราะห์ข้อผิดพลาดที่พบบ่อย
   */
  function qFind(R) {
    return Q.find({
      q: `พิจารณาการแสดงวิธีทำต่อไปนี้ แล้วระบุบรรทัดที่ผิด สาเหตุ และคำตอบที่ถูกต้อง`,
      lines: [
        `บรรทัดที่ 1: กำหนดสมการ $(x + 3)^2 = 25$`,
        `บรรทัดที่ 2: ถอดรากที่สองทั้งสองข้าง จะได้ $x + 3 = 5$ เท่านั้น`,
        `บรรทัดที่ 3: จะได้คำตอบ $x = 2$ เพียงค่าเดียว`
      ],
      wrong: 1, // บรรทัดที่ผิดคือ index 1 (บรรทัดที่ 2)
      causes: [
        'ลืมคิดกรณีคำตอบที่เป็นลบจากการถอดรากที่สอง (ต้องเป็น $\\pm 5$)',
        'กระจายกำลังสองผิดพลาด',
        'ย้ายข้างเครื่องหมายบวกลบผิด'
      ],
      cause: 0, // สาเหตุที่ผิดคือ index 0
      fixLabel: 'คำตอบที่ถูกต้องของ $x$ มี 2 ค่าคือ $2$ และจำนวนใด',
      fix: { answer: -8, tol: 0, ph: 'พิมพ์ตัวเลข' },
      hint: `การถอดรากที่สองของ $25$ จะได้ทั้ง $+5$ และ $-5$`,
      why: `เพราะ $(-5)^2 = 25$ ด้วย ดังนั้น $x + 3 = -5 \\implies x = -8$`
    });
  }

  /**
   * [รูปแบบที่ 7: Q.group] สถานการณ์ต่อเนื่องหลายข้อย่อย (Story / Multi-part)
   * เหมาะสำหรับ: โจทย์ปัญหาประยุกต์, แบบจำลองทางคณิตศาสตร์ในชีวิตจริง
   */
  function qGroup(R) {
    const salary = R.int(20, 45) * 1000;
    const expense = salary * 0.5; // หักค่าใช้จ่าย 50%
    const allowance = 60000;      // ค่าลดหย่อนส่วนตัว

    return Q.group({
      story: `<b>สถานการณ์จำลอง: การคำนวณภาษีเงินได้บุคคลธรรมดา</b><br>` +

  /* ===================================================================

  window.HW = {
    // รหัสแบบฝึกหัด (ตรงตามโครงสร้างหลักสูตร)
    id: 'HW-01',
    unit: 1,
    unitName: 'หน่วยที่ 1 ชื่อหน่วยการเรียนรู้',

    sub: 'คำอธิบายสั้น ๆ 1–2 ประโยค บอกจุดประสงค์การเรียนรู้หรือทักษะที่นักเรียนจะได้ฝึกฝน',

    // สรุปจำนวนข้อ ระยะเวลา และสัดส่วนคะแนน K (ความรู้) / P (ทักษะกระบวนการ)
    size: '8 ข้อ · 15 นาที',

    // ลิงก์สื่อการสอน (ถ้ามี) ลิงก์ไปยังโฟลเดอร์สื่อการสอน
    // reviewFile: '1.1_ชื่อสื่อการสอน.html',

    // รายการด่านการเรียนรู้ (Level Progression)
    levels: [
      {
        short: 'ด่าน 1',
        title: 'ด่าน 1 · วอร์มอัปความเข้าใจ',
        kind: 'K',
        points: 1,
        skill: 'ความรู้ความเข้าใจพื้นฐานเกี่ยวกับหัวข้อนี้',
        review: 'หัวข้อ 1.1',
        desc: 'ตอบข้อคำถามเพื่อทบทวนมโนทัศน์เบื้องต้น',
        intro: 'เลือกตอบหรือเติมคำตอบให้ถูกต้อง ตอบถูกในครั้งแรกได้คะแนนเต็ม',
        build(R) {
          // [ใส่โจทย์ด่านที่ 1 ตรงนี้]

        points: 1,
        skill: 'การวิเคราะห์ข้อผิดพลาดและแก้ปัญหาในสถานการณ์จริง',
        review: 'หัวข้อ 1.3',
        desc: 'จับผิดวิธีทำและแก้โจทย์สถานการณ์ปัญหาหลายขั้นตอน',
        intro: 'วิเคราะห์ทีละขั้นตอน แสดงวิธีคิดอย่างมีเหตุผล',
        build(R) {
